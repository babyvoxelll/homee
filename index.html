<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        #player-container {
            width: 800px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .info {
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            font-size: 11px;
            text-align: center;
            margin-top: 2px;
            color: #000000;
            line-height: 1.6;
            max-width: 55%;
            word-wrap: break-word;
        }
        .info .dark-green {
            color: #006400;
        }
        .info .light-green {
            color: #32cd32;
        }
        .info .black {
            color: #000000;
        }
        .info .block {
            margin-bottom: 8px;
        }
        .info a {
            color: #32cd32;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>

    <div class="info">
        <div class="block">
            <span class="black">babyvoxelll.2bd.net은 베이비복스 팬들을 위한 팬사이트입니다.</span><br>
            <span class="black">이전에는 babyvoxelll.neocities.org라는 주소였으나 현재는 접속이 불가능합니다.</span>
        </div>
        <div class="block">
            <span class="dark-green">저작권 © 2026 babyvoxelll.2bd.net. 모든 권리 보유.</span><br>
            <span class="dark-green">이 페이지를 보려면 </span><span class="light-green">Macromedia Flash Player</span><span class="dark-green">가 필요합니다.</span><br>
            <span class="dark-green">웹사이트 제작자: Kaze</span>
        </div>
        <div class="block">
            <span class="dark-green">이메일: </span><a href="mailto:kazemorcihelp@gmail.com">kazemorcihelp@gmail.com</a>
        </div>
    </div>

    <!-- Подключаем официальный скрипт Ruffle -->
    <script src="https://unpkg.com/ruffle-rs/ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            let ruffle = window.RufflePlayer.newest();
            let player = ruffle.createPlayer();
            let container = document.getElementById("player-container");
            
            container.appendChild(player);
            
            player.load({
                url: "babyvoxelllmain.swf"
            });
        });
    </script>
</body>
</html>
