<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>babyvoxelll팬사이트 - Videos</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        #image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
            line-height: 0;
        }
        #image-container img {
            display: block;
            width: 45%;
            max-width: 550px;
            height: auto;
            margin: 0 auto;
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 110px;
            height: 20px;
        }
        .nav-overlay a:nth-child(1) { right: 34%; top: 0%; }
        .nav-overlay a:nth-child(2) { right: 34%; top: 14%; }
        .nav-overlay a:nth-child(3) { right: 34%; top: 24%; }
        .nav-overlay a:nth-child(4) { right: 34%; top: 44%; }
        .nav-overlay a:nth-child(5) { right: 34%; top: 62%; }
        .nav-overlay a:nth-child(6) { right: 34%; top: 74%; }

        .panelvideos-container {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            width: 55%;
            max-width: 600px;
            margin: 60px auto 0 auto;
            padding: 0;
            line-height: 0;
        }
        .panelvideos-container img {
            display: block;
            width: 50%;
            max-width: 280px;
            height: auto;
        }
        .videos-container {
            width: 55%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
        }
        .video-block {
            background-color: #ffffff;
            color: #000;
            padding: 15px 18px;
            margin-bottom: 0;
            border-radius: 0;
            border: 2px solid #00008b;
            border-bottom: 2px solid #00008b;
            min-height: 600px;
        }
        .video-block:last-child {
            border-bottom: 2px solid #00008b;
        }
        .video-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 40px;
        }
        .video-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        .video-thumb {
            width: 70px;
            height: auto;
            cursor: pointer;
        }
        .video-thumb canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .video-title {
            font-family: "Gulim", "Arial", sans-serif;
            font-weight: normal;
            font-size: 11px;
            color: #000;
            text-align: center;
            width: 70px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        .modal-content video {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
        }

        @media (max-width: 768px) {
            .videos-container {
                width: 85%;
                max-width: 600px;
            }
            .panelvideos-container {
                width: 85%;
                max-width: 600px;
                margin: 55px auto 0 auto;
            }
            .panelvideos-container img {
                width: 45%;
                max-width: 240px;
            }
            #image-container img {
                width: 60%;
                max-width: 450px;
            }
            .nav-overlay a {
                width: 90px;
                height: 16px;
            }
            .nav-overlay a:nth-child(1) { right: 26%; top: 0%; }
            .nav-overlay a:nth-child(2) { right: 26%; top: 14%; }
            .nav-overlay a:nth-child(3) { right: 26%; top: 24%; }
            .nav-overlay a:nth-child(4) { right: 26%; top: 44%; }
            .nav-overlay a:nth-child(5) { right: 26%; top: 62%; }
            .nav-overlay a:nth-child(6) { right: 26%; top: 74%; }
        }
        @media (max-width: 500px) {
            .videos-container {
                width: 95%;
            }
            .panelvideos-container {
                width: 95%;
                margin: 50px auto 0 auto;
            }
            .panelvideos-container img {
                width: 55%;
                max-width: 200px;
            }
            #image-container img {
                width: 75%;
                max-width: 350px;
            }
            .nav-overlay a {
                width: 70px;
                height: 12px;
            }
            .nav-overlay a:nth-child(1) { right: 20%; top: 0%; }
            .nav-overlay a:nth-child(2) { right: 20%; top: 14%; }
            .nav-overlay a:nth-child(3) { right: 20%; top: 24%; }
            .nav-overlay a:nth-child(4) { right: 20%; top: 44%; }
            .nav-overlay a:nth-child(5) { right: 20%; top: 62%; }
            .nav-overlay a:nth-child(6) { right: 20%; top: 74%; }
            .video-thumb {
                width: 60px;
            }
            .video-title {
                font-size: 10px;
                width: 60px;
            }
            .video-row {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="image-container">
        <img src="videos.jpg" alt="videos">
        <div class="nav-overlay">
            <a href="index.html"></a>
            <a href="profiles.html"></a>
            <a href="history.html"></a>
            <a href="discography.html"></a>
            <a href="bbachat.html"></a>
            <a href="photogallery.html"></a>
        </div>
    </div>
    
    <div class="panelvideos-container">
        <img src="panelvideos.jpg" alt="panelvideos">
    </div>
    
    <div class="videos-container">
        <div class="video-block">
            <div class="video-row">
                <div class="video-item">
                    <div class="video-thumb" onclick="openVideo('1.mp4')">
                        <canvas id="thumb1" width="70" height="40"></canvas>
                    </div>
                    <div class="video-title">1.mp4</div>
                </div>
                <div class="video-item">
                    <div class="video-thumb" onclick="openVideo('2.mp4')">
                        <canvas id="thumb2" width="70" height="40"></canvas>
                    </div>
                    <div class="video-title">2.mp4</div>
                </div>
                <div class="video-item">
                    <div class="video-thumb" onclick="openVideo('3.mp4')">
                        <canvas id="thumb3" width="70" height="40"></canvas>
                    </div>
                    <div class="video-title">3.mp4</div>
                </div>
                <div class="video-item">
                    <div class="video-thumb" onclick="openVideo('4.mp4')">
                        <canvas id="thumb4" width="70" height="40"></canvas>
                    </div>
                    <div class="video-title">4.mp4</div>
                </div>
                <div class="video-item">
                    <div class="video-thumb" onclick="openVideo('5.mp4')">
                        <canvas id="thumb5" width="70" height="40"></canvas>
                    </div>
                    <div class="video-title">5.mp4</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal" onclick="closeVideo(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <video id="modalVideo" controls></video>
        </div>
    </div>

    <script>
        function setupThumb(videoSrc, canvasId) {
            const video = document.createElement('video');
            video.src = videoSrc;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'auto';

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let duration = 0;
            let currentFrame = 0;
            let frames = [];
            let loopInterval = null;

            video.addEventListener('loadedmetadata', () => {
                duration = video.duration;
                const step = duration / 5;
                for (let i = 0; i < 5; i++) {
                    frames.push(step * i + step * 0.1);
                }
                video.currentTime = frames[0];
            });

            video.addEventListener('seeked', () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                currentFrame++;
                if (currentFrame < frames.length) {
                    video.currentTime = frames[currentFrame];
                } else {
                    if (loopInterval) clearTimeout(loopInterval);
                    loopInterval = setTimeout(() => {
                        currentFrame = 0;
                        video.currentTime = frames[0];
                    }, 400);
                }
            });

            video.addEventListener('error', () => {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('no preview', canvas.width/2, canvas.height/2);
            });
        }

        setupThumb('1.mp4', 'thumb1');
        setupThumb('2.mp4', 'thumb2');
        setupThumb('3.mp4', 'thumb3');
        setupThumb('4.mp4', 'thumb4');
        setupThumb('5.mp4', 'thumb5');

        function openVideo(src) {
            const modal = document.getElementById('modal');
            const video = document.getElementById('modalVideo');
            video.src = src;
            modal.classList.add('active');
            video.play();
        }

        function closeVideo(event) {
            const modal = document.getElementById('modal');
            const video = document.getElementById('modalVideo');
            modal.classList.remove('active');
            video.pause();
            video.currentTime = 0;
            video.src = '';
        }
    </script>
</body>
</html>
