<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #990033;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bbacommunity-top {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            margin: 0;
        }
        .bbacommunity-top img.bbacommunity {
            display: block;
            width: 260px;
            max-width: 70%;
            height: auto;
            margin: 0 auto;
        }
        .bbacommunity-top img.panel {
            display: block;
            width: 720px;
            max-width: 95%;
            height: auto;
            margin: -2px auto 0 auto;
        }
        .bbacommunity-nav {
            position: relative;
            width: 720px;
            max-width: 95%;
            height: 30px;
            margin: -30px auto 0 auto;
        }
        .bbacommunity-nav a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            height: 22px;
            top: 4px;
        }
        .bbacommunity-nav a:nth-child(1) { left: 0%;   width: 55px; }
        .bbacommunity-nav a:nth-child(2) { left: 11%;  width: 55px; }
        .bbacommunity-nav a:nth-child(3) { left: 23%;  width: 55px; }
        .bbacommunity-nav a:nth-child(4) { left: 36%;  width: 80px; }
        .bbacommunity-nav a:nth-child(5) { left: 52%;  width: 55px; }
        .bbacommunity-nav a:nth-child(6) { left: 65%;  width: 70px; }
        .bbacommunity-nav a:nth-child(7) { left: 85%;  width: 85px; }

        .bba-form-wrapper {
            width: 720px;
            max-width: 95%;
            margin: 20px auto 0 auto;
            background: transparent;
            color: #000;
            font-size: 12px;
        }
        .bba-form-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }
        .bba-form-table td {
            padding: 4px 6px;
            vertical-align: top;
            color: #fff;
            font-size: 12px;
        }
        .bba-form-table td.label {
            width: 100px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
        }
        .bba-form-table input[type="text"],
        .bba-form-table input[type="email"],
        .bba-form-table input[type="url"] {
            width: 180px;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #ccc;
            background: #fff;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        .bba-form-table textarea {
            width: 100%;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #ccc;
            background: #fff;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            min-height: 140px;
            resize: vertical;
        }
        .bba-form-table select {
            font-size: 12px;
            padding: 3px;
            border: 1px solid #ccc;
            background: #fff;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bba-colors-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 6px 0 0 0;
            padding: 4px 6px;
        }
        .bba-colors-row .label {
            width: 100px;
            font-weight: bold;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
            padding-top: 1px;
        }
        .bba-colors-row .color-row {
            display: inline-flex;
            gap: 10px;
            align-items: flex-start;
        }
        .bba-colors-row .color-item {
            position: relative;
            display: inline-block;
        }
        .bba-colors-row .circle {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #333;
            cursor: pointer;
            display: block;
        }
        .bba-colors-row .circle.selected {
            background: #0000cc;
        }
        .bba-colors-row .square {
            position: absolute;
            right: -3px;
            bottom: -3px;
            width: 6px;
            height: 6px;
            border: 1px solid #333;
        }
        .bba-colors-row .square.red { background: #ff0000; }
        .bba-colors-row .square.blue { background: #0000ff; }
        .bba-colors-row .square.pink { background: #ff69b4; }
        .bba-colors-row .square.green { background: #00aa00; }
        .bba-colors-row .square.purple { background: #800080; }
        .bba-colors-row .square.brown { background: #8b4513; }
        .bba-colors-row .square.black { background: #000000; }
        .bba-colors-row .square.orange { background: #ff8c00; }

        .bba-comment-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }
        .bba-comment-row textarea {
            flex: 1;
            min-height: 140px;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #ccc;
            background: #fff;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            resize: vertical;
        }
        .bba-comment-row .send-btn {
            flex-shrink: 0;
            background: #ffffff;
            color: #000;
            border: 1px solid #333;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 14px;
            cursor: pointer;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            align-self: flex-start;
        }
        .bba-comment-row .send-btn:hover {
            background: #eee;
        }

        .bba-chat-board {
            width: 98%;
            max-width: 1600px;
            margin: 30px auto 40px auto;
            background: #ffffff;
            border: 1px solid #000;
            min-height: 1200px;
            padding: 0;
            color: #000;
            font-size: 12px;
        }

        .bba-post {
            padding: 10px 14px;
            border-bottom: 1px solid #000;
        }
        .bba-post:last-child {
            border-bottom: none;
        }
        .bba-post-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .bba-post-header .post-title {
            color: #006400;
            font-weight: bold;
        }
        .bba-post-header .post-author {
            color: #000;
        }
        .bba-post-header .post-date {
            color: #000;
        }
        .bba-post-header .post-number {
            color: #000;
        }
        .bba-post-header .post-reply-btn {
            background: transparent;
            border: none;
            color: #0000ee;
            text-decoration: underline;
            font-size: 12px;
            cursor: pointer;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            padding: 0;
        }
        .bba-post-header .post-reply-btn:hover {
            color: #800020;
        }

        .bba-post-body {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .bba-post-body .post-img {
            flex-shrink: 0;
            width: 120px;
            height: auto;
        }
        .bba-post-body .post-img img {
            width: 100%;
            height: auto;
            display: block;
        }
        .bba-post-body .post-comment {
            flex: 1;
            min-width: 200px;
            font-size: 12px;
            color: #000;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bba-replies {
            margin-top: 8px;
            padding-left: 20px;
        }
        .bba-reply {
            padding: 6px 0;
            border-top: 1px dashed #000;
            font-size: 12px;
            color: #000;
        }
        .bba-reply .reply-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #000;
        }
        .bba-reply .reply-text {
            margin-top: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .reply-form-box {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: #f0f0f0;
            border: 1px solid #ccc;
        }
        .reply-form-box.open {
            display: block;
        }
        .reply-form-box input,
        .reply-form-box textarea {
            width: 100%;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #ccc;
            margin-bottom: 4px;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        .reply-form-box textarea {
            min-height: 50px;
        }
        .reply-form-box button {
            padding: 4px 16px;
            font-size: 12px;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        @media (max-width: 760px) {
            .bba-form-table td.label {
                width: 80px;
            }
            .bba-form-table input[type="text"],
            .bba-form-table input[type="email"],
            .bba-form-table input[type="url"] {
                width: 150px;
            }
            .bba-colors-row .label {
                width: 80px;
            }
        }
        @media (max-width: 500px) {
            .bba-form-table td.label {
                width: 65px;
                font-size: 11px;
            }
            .bba-form-table td {
                font-size: 11px;
            }
            .bba-form-table input[type="text"],
            .bba-form-table input[type="email"],
            .bba-form-table input[type="url"] {
                width: 120px;
            }
            .bba-post-body .post-img {
                width: 90px;
            }
            .bba-colors-row .label {
                width: 65px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="bbacommunity-top">
        <img src="bbacommunity.jpg" alt="bbacommunity" class="bbacommunity">
        <img src="panel.png" alt="panel" class="panel">
        <div class="bbacommunity-nav">
            <a href="videos.html"></a>
            <a href="index.html"></a>
            <a href="profiles.html"></a>
            <a href="discography.html"></a>
            <a href="history.html"></a>
            <a href="bbachat.html"></a>
            <a href="photogallery.html"></a>
        </div>
    </div>

    <div class="bba-form-wrapper">
        <table class="bba-form-table">
            <tr>
                <td class="label">이름</td>
                <td><input type="text" id="name" maxlength="20"></td>
            </tr>
            <tr>
                <td class="label">이메일</td>
                <td><input type="email" id="email" maxlength="60"></td>
            </tr>
            <tr>
                <td class="label">제목</td>
                <td><input type="text" id="title" maxlength="100"></td>
            </tr>
            <tr>
                <td class="label">　</td>
                <td>　</td>
            </tr>
            <tr>
                <td class="label">코멘트</td>
                <td>
                    <div class="bba-comment-row">
                        <textarea id="comment"></textarea>
                        <button id="submitBtn" class="send-btn">보내기</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">URL</td>
                <td><input type="url" id="url" placeholder="http(s)://"></td>
            </tr>
            <tr>
                <td class="label">이미지</td>
                <td>
                    <select id="image">
                        <option value=""></option>
                        <option value="kimez.jpg">kimez.jpg</option>
                        <option value="leeheejin.jpg">leeheejin.jpg</option>
                        <option value="shimeunjin.jpg">shimeunjin.jpg</option>
                        <option value="kanmiyoun.jpg">kanmiyoun.jpg</option>
                        <option value="yooneunhye.jpg">yooneunhye.jpg</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="padding:0;">
                    <div class="bba-colors-row">
                        <div class="label">텍스트 색상</div>
                        <div class="color-row">
                            <div class="color-item"><div class="circle" data-color="#ff0000"></div><div class="square red"></div></div>
                            <div class="color-item"><div class="circle" data-color="#0000ff"></div><div class="square blue"></div></div>
                            <div class="color-item"><div class="circle" data-color="#ff69b4"></div><div class="square pink"></div></div>
                            <div class="color-item"><div class="circle" data-color="#00aa00"></div><div class="square green"></div></div>
                            <div class="color-item"><div class="circle" data-color="#800080"></div><div class="square purple"></div></div>
                            <div class="color-item"><div class="circle" data-color="#8b4513"></div><div class="square brown"></div></div>
                            <div class="color-item"><div class="circle" data-color="#000000"></div><div class="square black"></div></div>
                            <div class="color-item"><div class="circle" data-color="#ff8c00"></div><div class="square orange"></div></div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="bba-chat-board" id="chatBoard"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBxl0S2LbjmxRTOGlAc6KsxIWM_ID7trI",
            authDomain: "babyvox-chat.firebaseapp.com",
            databaseURL: "https://babyvox-chat-default-rtdb.firebaseio.com",
            projectId: "babyvox-chat",
            storageBucket: "babyvox-chat.firebasestorage.app",
            messagingSenderId: "741605907733",
            appId: "1:741605907733:web:9f0cdb69685ac0e4631d1c",
            measurementId: "G-V53X8WZ4YR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, "bbacommunity/posts");

        let selectedColor = "#000000";

        document.querySelectorAll(".bba-colors-row .circle").forEach((circle) => {
            circle.addEventListener("click", () => {
                document.querySelectorAll(".bba-colors-row .circle").forEach((c) => c.classList.remove("selected"));
                circle.classList.add("selected");
                selectedColor = circle.getAttribute("data-color");
            });
        });

        function generateNumber() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function getDayOfWeek(date) {
            const days = ["일", "월", "화", "수", "목", "금", "토"];
            return days[date.getDay()];
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const pad = (n) => n.toString().padStart(2, "0");
            return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${getDayOfWeek(d)}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function renderPosts(posts) {
            const board = document.getElementById("chatBoard");
            board.innerHTML = "";

            posts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            posts.forEach((post) => {
                const postEl = document.createElement("div");
                postEl.className = "bba-post";

                const header = document.createElement("div");
                header.className = "bba-post-header";

                const title = document.createElement("span");
                title.className = "post-title";
                title.textContent = post.title || "";
                header.appendChild(title);

                const author = document.createElement("span");
                author.className = "post-author";
                author.textContent = "작성자: " + (post.name || "");
                header.appendChild(author);

                const date = document.createElement("span");
                date.className = "post-date";
                date.textContent = formatDate(post.timestamp);
                header.appendChild(date);

                const num = document.createElement("span");
                num.className = "post-number";
                num.textContent = "No." + (post.number || "");
                header.appendChild(num);

                const replyBtn = document.createElement("button");
                replyBtn.className = "post-reply-btn";
                replyBtn.textContent = "답변";
                replyBtn.addEventListener("click", () => {
                    const box = document.getElementById("replyBox-" + post.id);
                    if (box) {
                        box.classList.toggle("open");
                    }
                });
                header.appendChild(replyBtn);

                postEl.appendChild(header);

                const body = document.createElement("div");
                body.className = "bba-post-body";

                if (post.image) {
                    const imgWrap = document.createElement("div");
                    imgWrap.className = "post-img";
                    const img = document.createElement("img");
                    img.src = post.image;
                    img.alt = "image";
                    imgWrap.appendChild(img);
                    body.appendChild(imgWrap);
                }

                const comment = document.createElement("div");
                comment.className = "post-comment";
                comment.textContent = post.comment || "";
                if (post.textColor) {
                    comment.style.color = post.textColor;
                }
                body.appendChild(comment);

                postEl.appendChild(body);

                if (post.url) {
                    const urlLine = document.createElement("div");
                    urlLine.style.marginTop = "6px";
                    urlLine.style.fontSize = "12px";
                    const urlLink = document.createElement("a");
                    urlLink.href = post.url;
                    urlLink.target = "_blank";
                    urlLink.textContent = post.url;
                    urlLink.style.color = "#0000ee";
                    urlLine.appendChild(urlLink);
                    postEl.appendChild(urlLine);
                }

                const repliesBox = document.createElement("div");
                repliesBox.className = "bba-replies";

                if (post.replies) {
                    const replyKeys = Object.keys(post.replies);
                    replyKeys.forEach((k) => {
                        const r = post.replies[k];
                        const replyEl = document.createElement("div");
                        replyEl.className = "bba-reply";

                        const rHeader = document.createElement("div");
                        rHeader.className = "reply-header";

                        const rAuthor = document.createElement("span");
                        rAuthor.textContent = "작성자: " + (r.name || "");
                        rHeader.appendChild(rAuthor);

                        const rDate = document.createElement("span");
                        rDate.textContent = formatDate(r.timestamp);
                        rHeader.appendChild(rDate);

                        replyEl.appendChild(rHeader);

                        const rText = document.createElement("div");
                        rText.className = "reply-text";
                        rText.textContent = r.comment || "";
                        if (r.textColor) {
                            rText.style.color = r.textColor;
                        }
                        replyEl.appendChild(rText);

                        repliesBox.appendChild(replyEl);
                    });
                }

                const replyBox = document.createElement("div");
                replyBox.className = "reply-form-box";
                replyBox.id = "replyBox-" + post.id;

                const rNameInput = document.createElement("input");
                rNameInput.type = "text";
                rNameInput.placeholder = "이름";
                replyBox.appendChild(rNameInput);

                const rCommentInput = document.createElement("textarea");
                rCommentInput.placeholder = "코멘트";
                replyBox.appendChild(rCommentInput);

                const rSubmit = document.createElement("button");
                rSubmit.textContent = "답변 보내기";
                rSubmit.addEventListener("click", async () => {
                    const rName = rNameInput.value.trim();
                    const rComment = rCommentInput.value.trim();
                    if (!rName || !rComment) {
                        alert("이름과 코멘트를 입력하세요.");
                        return;
                    }
                    const replyRef = ref(db, "bbacommunity/posts/" + post.id + "/replies");
                    await push(replyRef, {
                        name: rName,
                        comment: rComment,
                        textColor: selectedColor,
                        timestamp: Date.now()
                    });
                    rNameInput.value = "";
                    rCommentInput.value = "";
                    replyBox.classList.remove("open");
                });
                replyBox.appendChild(rSubmit);

                repliesBox.appendChild(replyBox);
                postEl.appendChild(repliesBox);

                board.appendChild(postEl);
            });
        }

        onValue(postsRef, (snapshot) => {
            const posts = [];
            snapshot.forEach((child) => {
                const val = child.val();
                val.id = child.key;
                posts.push(val);
            });
            renderPosts(posts);
        });

        document.getElementById("submitBtn").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const title = document.getElementById("title").value.trim();
            const comment = document.getElementById("comment").value.trim();
            const url = document.getElementById("url").value.trim();
            const image = document.getElementById("image").value;

            if (!name || !title || !comment) {
                alert("이름, 제목, 코멘트를 입력하세요.");
                return;
            }

            const userNumber = generateNumber();

            await push(postsRef, {
                number: userNumber,
                name: name,
                email: email,
                title: title,
                comment: comment,
                url: url,
                image: image || null,
                textColor: selectedColor,
                timestamp: Date.now()
            });

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("title").value = "";
            document.getElementById("comment").value = "";
            document.getElementById("url").value = "";
            document.getElementById("image").value = "";
            document.querySelectorAll(".bba-colors-row .circle").forEach((c) => c.classList.remove("selected"));
            selectedColor = "#000000";
        });
    </script>
</body>
</html>
