<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll</title>
    <style>
        /* Полный сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        /* Главный контейнер — строго по центру */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            /* Смещение вниз на 25px */
            transform: translateY(25px);
        }

        /* Контейнер для плеера */
        #player-container {
            width: 800px;
            height: 600px;
            flex-shrink: 0;
            background-color: #ffffff;
        }

        /* Блок с информацией — маленький пиксельный текст */
        .info-block {
            margin-top: 16px;
            text-align: center;
            font-size: 11px;
            line-height: 1.7;
            font-family: 'Courier New', Courier, monospace;
            max-width: 800px;
            padding: 0 10px;
            letter-spacing: 0.3px;
        }

        /* Чёрный текст */
        .text-black {
            color: #000000;
        }

        /* Тёмно-зелёный (основной) */
        .text-dark-green {
            color: #1a4a1a;
        }

        /* Светло-зелёный */
        .text-light-green {
            color: #4f9f4f;
        }

        /* Адаптивность */
        @media (max-width: 850px) {
            #player-container {
                width: 100%;
                height: auto;
                aspect-ratio: 800 / 600;
            }
            .info-block {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="player-container"></div>

        <!-- Информационный блок -->
        <div class="info-block">
            <p class="text-black">
                babyvoxelll.2bd.net은 베이비복스 팬들을 위한 팬사이트입니다. 이전에는 babyvoxelll.neocities.org라는 주소였으나 현재는 접속이 불가능합니다.
            </p>
            <p class="text-dark-green">
                저작권 © 2026 babyvoxelll.2bd.net. 모든 권리 보유.
            </p>
            <p class="text-dark-green">
                이 페이지를 보려면 <span class="text-light-green">Macromedia Flash Player</span>가 필요합니다.
            </p>
            <p class="text-dark-green">
                웹사이트 제작자: Kaze<br>
                이메일: <span class="text-light-green">kazemorcihelp@gmail.com</span>
            </p>
        </div>
    </div>

    <!-- Подключаем Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@latest/ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");

            container.innerHTML = '';
            container.appendChild(player);

            player.load({
                url: "babyvoxelllmain.swf"
            });
        });
    </script>
</body>
</html>
