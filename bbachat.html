<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        #image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
            line-height: 0;
        }
        #image-container img {
            display: block;
            width: 45%;
            max-width: 550px;
            height: auto;
            aspect-ratio: auto;
            object-fit: scale-down;
            margin: 0 auto;
            transform: scaleY(0.75);
            transform-origin: top center;
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 110px;
            height: 20px;
        }
        .nav-overlay a:nth-child(1) { right: 36%; top: 8%; }
        .nav-overlay a:nth-child(2) { right: 36%; top: 17%; }
        .nav-overlay a:nth-child(3) { right: 36%; top: 26%; }
        .nav-overlay a:nth-child(4) { right: 36%; top: 35%; }
        .nav-overlay a:nth-child(5) { right: 36%; top: 44%; }
        .nav-overlay a:nth-child(6) { right: 36%; top: 53%; }
        .nav-overlay a:nth-child(7) { right: 36%; top: 62%; }

        .bbachat-wrapper {
            width: 55%;
            max-width: 700px;
            margin: 15px auto 0 auto;
            padding: 20px;
            background: #404040;
            border-radius: 6px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .bbachat-left {
            flex: 1;
            background: #d0d0d0;
            border-radius: 4px;
            padding: 10px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }
        .bbachat-header {
            background: #ff69b4;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 6px;
            display: grid;
            grid-template-columns: 40px 1fr 70px 90px 100px;
            gap: 4px;
            text-align: center;
            border-radius: 2px 2px 0 0;
        }
        .bbachat-messages {
            flex: 1;
            background: #e8e8e8;
            padding: 6px;
            overflow-y: auto;
            font-size: 10px;
            border-radius: 0 0 2px 2px;
            max-height: 460px;
        }
        .bbachat-row {
            display: grid;
            grid-template-columns: 40px 1fr 70px 90px 100px;
            gap: 4px;
            padding: 3px 4px;
            border-bottom: 1px solid #c0c0c0;
            align-items: center;
            text-align: center;
            word-wrap: break-word;
        }
        .bbachat-row .msg-cell {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .bbachat-row .msg-cell img.new-icon {
            width: 22px;
            height: auto;
        }
        .bbachat-row .file-cell img {
            width: 28px;
            height: auto;
        }
        .bbachat-form {
            width: 180px;
            background: #e8e8e8;
            border-radius: 4px;
            padding: 10px;
            flex-shrink: 0;
        }
        .bbachat-form .form-title {
            font-size: 10px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            text-align: center;
        }
        .bbachat-form label {
            display: block;
            font-size: 10px;
            color: #000;
            margin-bottom: 2px;
            margin-top: 6px;
        }
        .bbachat-form input[type="text"],
        .bbachat-form input[type="file"] {
            width: 100%;
            font-size: 10px;
            padding: 3px;
            border: 1px solid #888;
            border-radius: 2px;
            background: #fff;
        }
        .bbachat-form button {
            width: 100%;
            margin-top: 10px;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #ff69b4;
            color: #000;
            border: 1px solid #888;
            border-radius: 2px;
            cursor: pointer;
        }
        .bbachat-form button:hover {
            background: #ff85c2;
        }
        @media (max-width: 768px) {
            .bbachat-wrapper {
                width: 85%;
                flex-direction: column;
            }
            .bbachat-form {
                width: 100%;
            }
            #image-container img {
                width: 60%;
                max-width: 450px;
                transform: scaleY(0.75);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 90px;
                height: 16px;
            }
            .nav-overlay a:nth-child(1) { right: 29%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 29%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 29%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 29%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 29%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 29%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 29%; top: 62%; }
        }
        @media (max-width: 500px) {
            .bbachat-wrapper {
                width: 95%;
            }
            .bbachat-header,
            .bbachat-row {
                grid-template-columns: 30px 1fr 50px 60px 70px;
                font-size: 9px;
            }
            #image-container img {
                width: 75%;
                max-width: 350px;
                transform: scaleY(0.7);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 70px;
                height: 12px;
            }
            .nav-overlay a:nth-child(1) { right: 22%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 22%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 22%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 22%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 22%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 22%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 22%; top: 62%; }
        }
    </style>
</head>
<body>
    <div id="image-container">
        <img src="bbachat.jpg" alt="bbachat">
        <div class="nav-overlay">
            <a href="videos.html"></a>
            <a href="index.html"></a>
            <a href="profiles.html"></a>
            <a href="discography.html"></a>
            <a href="history.html"></a>
            <a href="bbachat.html"></a>
            <a href="photogallery.html"></a>
        </div>
    </div>

    <div class="bbachat-wrapper">
        <div class="bbachat-left">
            <div class="bbachat-header">
                <div>번호</div>
                <div>메시지</div>
                <div>파일</div>
                <div>이름</div>
                <div>등록일</div>
            </div>
            <div class="bbachat-messages" id="messages"></div>
        </div>

        <div class="bbachat-form">
            <div class="form-title">메시지 보내기</div>
            <label>이름</label>
            <input type="text" id="name" maxlength="20" required>
            <label>메시지</label>
            <input type="text" id="message" maxlength="200" required>
            <label>파일 (jpg/exe)</label>
            <input type="file" id="file" accept=".jpg,.jpeg,.exe">
            <label>기프</label>
            <input type="text" id="gif" maxlength="20">
            <button id="sendBtn">보내기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBxl0S2LbjmxRTOGlAc6KsxIWM_ID7trI",
            authDomain: "babyvox-chat.firebaseapp.com",
            databaseURL: "https://babyvox-chat-default-rtdb.firebaseio.com",
            projectId: "babyvox-chat",
            storageBucket: "babyvox-chat.firebasestorage.app",
            messagingSenderId: "741605907733",
            appId: "1:741605907733:web:9f0cdb69685ac0e4631d1c",
            measurementId: "G-V53X8WZ4YR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, "bbachat/messages");

        // Получаем или генерируем постоянный ID (сохраняется в localStorage)
        function getUserNumber() {
            let num = localStorage.getItem("bbachat_number");
            if (!num) {
                num = Math.floor(10000 + Math.random() * 90000).toString();
                localStorage.setItem("bbachat_number", num);
            }
            return num;
        }

        // Рендер одного сообщения
        function renderMessage(key, data) {
            const row = document.createElement("div");
            row.className = "bbachat-row";

            const numCell = document.createElement("div");
            numCell.textContent = data.number || "";

            const msgCell = document.createElement("div");
            msgCell.className = "msg-cell";

            // new.gif показываем, если сообщение младше 24 часов
            if (data.timestamp) {
                const age = Date.now() - data.timestamp;
                if (age < 24 * 60 * 60 * 1000) {
                    const newImg = document.createElement("img");
                    newImg.src = "new.gif";
                    newImg.className = "new-icon";
                    newImg.alt = "new";
                    msgCell.appendChild(newImg);
                }
            }
            const msgText = document.createElement("span");
            msgText.textContent = data.message || "";
            msgCell.appendChild(msgText);

            const fileCell = document.createElement("div");
            fileCell.className = "file-cell";
            if (data.fileType === "jpg") {
                const img = document.createElement("img");
                img.src = "JPG.gif";
                img.alt = "JPG";
                fileCell.appendChild(img);
            } else if (data.fileType === "exe") {
                const img = document.createElement("img");
                img.src = "EXE.gif";
                img.alt = "EXE";
                fileCell.appendChild(img);
            }

            const nameCell = document.createElement("div");
            nameCell.textContent = data.name || "";

            const dateCell = document.createElement("div");
            if (data.timestamp) {
                const d = new Date(data.timestamp);
                const pad = (n) => n.toString().padStart(2, "0");
                dateCell.textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            row.appendChild(numCell);
            row.appendChild(msgCell);
            row.appendChild(fileCell);
            row.appendChild(nameCell);
            row.appendChild(dateCell);

            return row;
        }

        // Загрузка сообщений
        onValue(messagesRef, (snapshot) => {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            const items = [];
            snapshot.forEach((child) => {
                items.push({ key: child.key, data: child.val() });
            });
            // Сортируем по времени (старые сверху)
            items.sort((a, b) => (a.data.timestamp || 0) - (b.data.timestamp || 0));
            items.forEach((item) => {
                container.appendChild(renderMessage(item.key, item.data));
            });
            container.scrollTop = container.scrollHeight;
        });

        // Отправка
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const message = document.getElementById("message").value.trim();
            const fileInput = document.getElementById("file");
            const gif = document.getElementById("gif").value.trim();

            if (!name || !message) {
                alert("이름과 메시지를 입력하세요.");
                return;
            }

            let fileType = null;
            if (fileInput.files && fileInput.files.length > 0) {
                const fname = fileInput.files[0].name.toLowerCase();
                if (fname.endsWith(".jpg") || fname.endsWith(".jpeg")) {
                    fileType = "jpg";
                } else if (fname.endsWith(".exe")) {
                    fileType = "exe";
                } else {
                    alert("jpg 또는 exe 파일만 업로드할 수 있습니다.");
                    return;
                }
            }

            const userNumber = getUserNumber();

            await push(messagesRef, {
                number: userNumber,
                message: message,
                name: name,
                fileType: fileType,
                gif: gif || null,
                timestamp: Date.now()
            });

            document.getElementById("message").value = "";
            document.getElementById("file").value = "";
            document.getElementById("gif").value = "";
        });
    </script>
</body>
</html>
