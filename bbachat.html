<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bbachat-outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 auto;
            width: 900px;
            max-width: 100%;
            padding: 0;
        }

        .bbacommunity-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 0;
            margin: 0;
            padding: 0;
        }
        .bbacommunity-wrap img {
            display: block;
            width: 130px;
            height: auto;
            margin: 0 auto;
        }

        .bbachat-top-imgs {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            line-height: 0;
            display: flex;
            justify-content: center;
        }
        .bbachat-top-imgs img.panel {
            display: block;
            width: 900px;
            max-width: 100%;
            height: auto;
        }

        .nav-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            max-width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            height: 22px;
        }
        .nav-overlay a:nth-child(1) { left: 3%;   bottom: 4%; width: 55px; }
        .nav-overlay a:nth-child(2) { left: 12%;  bottom: 4%; width: 55px; }
        .nav-overlay a:nth-child(3) { left: 22%;  bottom: 4%; width: 55px; }
        .nav-overlay a:nth-child(4) { left: 33%;  bottom: 4%; width: 80px; }
        .nav-overlay a:nth-child(5) { left: 46%;  bottom: 4%; width: 55px; }
        .nav-overlay a:nth-child(6) { left: 58%;  bottom: 4%; width: 70px; }
        .nav-overlay a:nth-child(7) { left: 73%;  bottom: 4%; width: 85px; }

        .form-outer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: flex-end;
        }
        .color-picker .circle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .color-picker .circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid #333;
            background: #fff;
            transition: all 0.15s;
        }
        .color-picker .circle.selected {
            background: #0033cc;
            border-color: #0033cc;
        }
        .color-picker .square {
            width: 8px;
            height: 8px;
            margin-top: 3px;
        }

        .form-table {
            width: 100%;
            max-width: 720px;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 4px 6px;
            font-size: 12px;
            vertical-align: top;
            color: #000;
        }
        .form-table td.label-cell {
            width: 120px;
            white-space: nowrap;
            font-weight: bold;
        }
        .form-table td.input-cell {
            width: auto;
        }
        .form-table input[type="text"],
        .form-table textarea {
            width: 100%;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #666;
            background: #fff;
            box-sizing: border-box;
        }
        .form-table textarea {
            height: 120px;
            resize: vertical;
        }
        .form-table input[type="url"] {
            width: 100%;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
            font-size: 12px;
            padding: 3px 5px;
            border: 1px solid #666;
            background: #fff;
            box-sizing: border-box;
        }

        .images-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .images-list .img-choice {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 4px;
            border: 1px solid #ccc;
            background: #f4f4f4;
        }
        .images-list .img-choice.selected {
            border-color: #0033cc;
            background: #dbe4ff;
        }
        .images-list .img-choice input {
            margin: 0;
        }

        .submit-row {
            margin-top: 12px;
            text-align: center;
        }
        .submit-row button {
            padding: 6px 24px;
            font-size: 13px;
            font-weight: bold;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
        .submit-row button:hover {
            background: #a00028;
        }

        .chat-board {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: #ffffff;
            border: 1px solid #000;
            min-height: 300px;
            padding: 0;
        }
        .post {
            padding: 12px 16px;
            border-bottom: 1px solid #000;
        }
        .post:last-child {
            border-bottom: 1px solid #000;
        }
        .post-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .post-header .post-title {
            color: #005500;
            font-weight: bold;
            font-size: 14px;
        }
        .post-header .post-author {
            color: #000;
        }
        .post-header .post-date {
            color: #333;
        }
        .post-header .post-num {
            color: #333;
        }
        .post-header .reply-btn {
            margin-left: auto;
            background: #eee;
            border: 1px solid #888;
            font-size: 11px;
            padding: 2px 8px;
            cursor: pointer;
            font-family: inherit;
        }
        .post-header .reply-btn:hover {
            background: #800020;
            color: #fff;
            border-color: #800020;
        }
        .post-body {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 12px;
        }
        .post-body img.post-image {
            width: 120px;
            height: auto;
            flex-shrink: 0;
            border: 1px solid #ccc;
        }
        .post-body .post-comment {
            flex: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: #000;
        }
        .post-body .post-link {
            display: block;
            margin-top: 4px;
            color: #0000ee;
            text-decoration: underline;
            font-size: 11px;
            word-break: break-all;
        }

        .reply-block {
            margin-top: 8px;
            margin-left: 30px;
            padding-top: 8px;
            border-top: 1px solid #000;
            padding-left: 10px;
        }
        .reply-block .reply {
            padding: 6px 0;
            border-bottom: 1px dotted #999;
            font-size: 12px;
        }
        .reply-block .reply:last-child {
            border-bottom: none;
        }
        .reply-block .reply .reply-header {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 11px;
            color: #333;
            margin-bottom: 3px;
        }
        .reply-block .reply .reply-header .reply-title {
            color: #005500;
            font-weight: bold;
        }
        .reply-block .reply .reply-header .reply-num {
            color: #333;
        }
        .reply-block .reply .reply-header .reply-author {
            color: #000;
        }
        .reply-block .reply-header .reply-btn {
            margin-left: auto;
            background: #eee;
            border: 1px solid #888;
            font-size: 10px;
            padding: 1px 6px;
            cursor: pointer;
            font-family: inherit;
        }
        .reply-block .reply-header .reply-btn:hover {
            background: #800020;
            color: #fff;
            border-color: #800020;
        }
        .reply-block .reply .reply-body {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .reply-block .reply .reply-body img.reply-image {
            width: 80px;
            height: auto;
            flex-shrink: 0;
            border: 1px solid #ccc;
        }
        .reply-block .reply .reply-body .reply-comment {
            flex: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .reply-block .reply .reply-body .reply-link {
            display: block;
            margin-top: 4px;
            color: #0000ee;
            text-decoration: underline;
            font-size: 11px;
            word-break: break-all;
        }

        .reply-form-inline {
            margin-top: 8px;
            padding: 8px;
            background: #f4f4f4;
            border: 1px solid #999;
            font-size: 11px;
        }
        .reply-form-inline .row {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }
        .reply-form-inline input[type="text"],
        .reply-form-inline textarea {
            font-family: inherit;
            font-size: 11px;
            padding: 2px 4px;
            border: 1px solid #666;
            background: #fff;
            flex: 1;
        }
        .reply-form-inline textarea {
            min-height: 50px;
            resize: vertical;
        }
        .reply-form-inline button {
            padding: 3px 10px;
            font-size: 11px;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-family: inherit;
        }
        .reply-form-inline button.cancel-btn {
            background: #ccc;
            color: #000;
        }

        @media (max-width: 900px) {
            .bbachat-outer {
                width: 100%;
                padding: 0 8px;
            }
            .form-table td.label-cell {
                width: 100px;
                font-size: 11px;
            }
            .nav-overlay a {
                height: 18px;
            }
        }
        @media (max-width: 600px) {
            .bbacommunity-wrap img {
                width: 100px;
            }
            .post-body img.post-image {
                width: 90px;
            }
            .reply-block .reply .reply-body img.reply-image {
                width: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="bbachat-outer">
        <div class="bbacommunity-wrap">
            <img src="bbacommunity.jpg" alt="bbacommunity">
        </div>

        <div class="bbachat-top-imgs">
            <img src="bbachat.jpg" alt="bbachat" class="panel">
            <div class="nav-overlay">
                <a href="videos.html"></a>
                <a href="index.html"></a>
                <a href="profiles.html"></a>
                <a href="discography.html"></a>
                <a href="history.html"></a>
                <a href="bbachat.html"></a>
                <a href="photogallery.html"></a>
            </div>
        </div>

        <div class="form-outer">

            <div class="color-picker" id="colorPicker">
                <div class="circle-wrap" data-color="#cc0000"><div class="circle"></div><div class="square" style="background:#cc0000;"></div></div>
                <div class="circle-wrap" data-color="#0033cc"><div class="circle"></div><div class="square" style="background:#0033cc;"></div></div>
                <div class="circle-wrap" data-color="#ff66b3"><div class="circle"></div><div class="square" style="background:#ff66b3;"></div></div>
                <div class="circle-wrap" data-color="#009933"><div class="circle"></div><div class="square" style="background:#009933;"></div></div>
                <div class="circle-wrap" data-color="#8000cc"><div class="circle"></div><div class="square" style="background:#8000cc;"></div></div>
                <div class="circle-wrap" data-color="#8b4513"><div class="circle"></div><div class="square" style="background:#8b4513;"></div></div>
                <div class="circle-wrap" data-color="#000000"><div class="circle"></div><div class="square" style="background:#000000;"></div></div>
                <div class="circle-wrap" data-color="#ff8800"><div class="circle"></div><div class="square" style="background:#ff8800;"></div></div>
            </div>

            <table class="form-table">
                <tr>
                    <td class="label-cell">이름</td>
                    <td class="input-cell"><input type="text" id="fieldName" maxlength="20"></td>
                </tr>
                <tr>
                    <td class="label-cell">전자 우편</td>
                    <td class="input-cell"><input type="text" id="fieldEmail" maxlength="60"></td>
                </tr>
                <tr>
                    <td class="label-cell">제목</td>
                    <td class="input-cell"><input type="text" id="fieldTitle" maxlength="80"></td>
                </tr>
                <tr>
                    <td class="label-cell">코멘트</td>
                    <td class="input-cell"><textarea id="fieldComment"></textarea></td>
                </tr>
                <tr>
                    <td class="label-cell">URL</td>
                    <td class="input-cell"><input type="text" id="fieldUrl" value="http(s)://" onfocus="if(this.value=='http(s)://')this.value='';" onblur="if(this.value=='')this.value='http(s)://';"></td>
                </tr>
                <tr>
                    <td class="label-cell">이미지</td>
                    <td class="input-cell">
                        <div class="images-list" id="imagesList">
                            <label class="img-choice"><input type="radio" name="img" value="kimez.jpg">kimez.jpg</label>
                            <label class="img-choice"><input type="radio" name="img" value="leeheejin.jpg">leeheejin.jpg</label>
                            <label class="img-choice"><input type="radio" name="img" value="shimeunjin.jpg">shimeunjin.jpg</label>
                            <label class="img-choice"><input type="radio" name="img" value="kanmiyoun.jpg">kanmiyoun.jpg</label>
                            <label class="img-choice"><input type="radio" name="img" value="yooneunhye.jpg">yooneunhye.jpg</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label-cell">텍스트 색상</td>
                    <td class="input-cell" id="colorLabelCell">—</td>
                </tr>
            </table>

            <div class="submit-row">
                <button id="submitPost">보내기</button>
            </div>
        </div>

        <div class="chat-board" id="chatBoard"></div>
    </div>

    <script>
        const colorPicker = document.getElementById('colorPicker');
        const colorLabelCell = document.getElementById('colorLabelCell');
        let selectedColor = '#000000';

        colorPicker.querySelectorAll('.circle-wrap').forEach(wrap => {
            wrap.addEventListener('click', () => {
                colorPicker.querySelectorAll('.circle').forEach(c => c.classList.remove('selected'));
                wrap.querySelector('.circle').classList.add('selected');
                selectedColor = wrap.getAttribute('data-color');
                colorLabelCell.textContent = selectedColor;
            });
        });

        document.querySelectorAll('#imagesList .img-choice').forEach(label => {
            label.addEventListener('click', () => {
                setTimeout(() => {
                    document.querySelectorAll('#imagesList .img-choice').forEach(l => l.classList.remove('selected'));
                    if (label.querySelector('input').checked) label.classList.add('selected');
                }, 0);
            });
        });

        const DAYS_KR = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

        function formatDateKR(ts) {
            const d = new Date(ts);
            const pad = n => n.toString().padStart(2,'0');
            return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 ${DAYS_KR[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function randomNum() {
            return Math.floor(10000 + Math.random()*90000).toString();
        }

        const posts = [];

        const chatBoard = document.getElementById('chatBoard');

        function renderPosts() {
            chatBoard.innerHTML = '';
            posts.forEach((post, idx) => {
                chatBoard.appendChild(buildPost(post, idx));
            });
        }

        function buildPost(post, postIndex) {
            const el = document.createElement('div');
            el.className = 'post';

            const header = document.createElement('div');
            header.className = 'post-header';

            const title = document.createElement('span');
            title.className = 'post-title';
            title.textContent = post.title || '(제목 없음)';
            title.style.color = '#005500';
            header.appendChild(title);

            const author = document.createElement('span');
            author.className = 'post-author';
            author.textContent = '글쓴이: ' + (post.name || '익명');
            header.appendChild(author);

            const date = document.createElement('span');
            date.className = 'post-date';
            date.textContent = formatDateKR(post.timestamp);
            header.appendChild(date);

            const num = document.createElement('span');
            num.className = 'post-num';
            num.textContent = '№' + post.number;
            header.appendChild(num);

            const replyBtn = document.createElement('button');
            replyBtn.className = 'reply-btn';
            replyBtn.textContent = '답변';
            replyBtn.addEventListener('click', () => toggleReplyForm(el, post, postIndex));
            header.appendChild(replyBtn);

            el.appendChild(header);

            const body = document.createElement('div');
            body.className = 'post-body';

            if (post.image) {
                const img = document.createElement('img');
                img.className = 'post-image';
                img.src = post.image;
                img.alt = post.image;
                body.appendChild(img);
            }

            const comment = document.createElement('div');
            comment.className = 'post-comment';
            comment.textContent = post.comment || '';
            comment.style.color = post.color || '#000';
            if (post.url && post.url !== 'http(s)://' && post.url.trim() !== '') {
                const link = document.createElement('a');
                link.className = 'post-link';
                link.href = post.url;
                link.target = '_blank';
                link.textContent = post.url;
                comment.appendChild(link);
            }
            body.appendChild(comment);

            el.appendChild(body);

            const replies = document.createElement('div');
            replies.className = 'reply-block';
            replies.dataset.postIndex = postIndex;

            if (post.replies && post.replies.length) {
                post.replies.forEach(r => {
                    replies.appendChild(buildReply(r, postIndex));
                });
            }

            el.appendChild(replies);

            return el;
        }

        function buildReply(reply, postIndex) {
            const r = document.createElement('div');
            r.className = 'reply';

            const header = document.createElement('div');
            header.className = 'reply-header';

            const title = document.createElement('span');
            title.className = 'reply-title';
            title.textContent = reply.title || '(제목 없음)';
            title.style.color = '#005500';
            header.appendChild(title);

            const author = document.createElement('span');
            author.className = 'reply-author';
            author.textContent = '글쓴이: ' + (reply.name || '익명');
            header.appendChild(author);

            const date = document.createElement('span');
            date.textContent = formatDateKR(reply.timestamp);
            header.appendChild(date);

            const num = document.createElement('span');
            num.className = 'reply-num';
            num.textContent = '№' + reply.number;
            header.appendChild(num);

            const replyBtn = document.createElement('button');
            replyBtn.className = 'reply-btn';
            replyBtn.textContent = '답변';
            replyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const postEl = r.closest('.post');
                const post = posts[postIndex];
                toggleReplyForm(postEl, post, postIndex);
            });
            header.appendChild(replyBtn);

            r.appendChild(header);

            const body = document.createElement('div');
            body.className = 'reply-body';

            if (reply.image) {
                const img = document.createElement('img');
                img.className = 'reply-image';
                img.src = reply.image;
                img.alt = reply.image;
                body.appendChild(img);
            }

            const comment = document.createElement('div');
            comment.className = 'reply-comment';
            comment.textContent = reply.comment || '';
            comment.style.color = reply.color || '#000';
            if (reply.url && reply.url !== 'http(s)://' && reply.url.trim() !== '') {
                const link = document.createElement('a');
                link.className = 'reply-link';
                link.href = reply.url;
                link.target = '_blank';
                link.textContent = reply.url;
                comment.appendChild(link);
            }
            body.appendChild(comment);

            r.appendChild(body);

            return r;
        }

        function toggleReplyForm(postEl, post, postIndex) {
            let existing = postEl.querySelector('.reply-form-inline');
            if (existing) {
                existing.remove();
                return;
            }

            const form = document.createElement('div');
            form.className = 'reply-form-inline';
            form.innerHTML = `
                <div class="row">
                    <input type="text" class="rf-name" placeholder="이름" maxlength="20">
                    <input type="text" class="rf-title" placeholder="제목" maxlength="80">
                </div>
                <div class="row">
                    <input type="text" class="rf-email" placeholder="전자 우편" maxlength="60">
                    <input type="text" class="rf-url" placeholder="http(s)://" maxlength="200">
                </div>
                <div class="row">
                    <textarea class="rf-comment" placeholder="코멘트"></textarea>
                </div>
                <div class="row" style="justify-content:flex-end;">
                    <button class="cancel-btn">취소</button>
                    <button class="send-reply-btn">보내기</button>
                </div>
            `;

            form.querySelector('.cancel-btn').addEventListener('click', () => form.remove());
            form.querySelector('.send-reply-btn').addEventListener('click', () => {
                const name = form.querySelector('.rf-name').value.trim() || '익명';
                const title = form.querySelector('.rf-title').value.trim() || '(제목 없음)';
                const comment = form.querySelector('.rf-comment').value.trim();
                const url = form.querySelector('.rf-url').value.trim();

                if (!comment) {
                    alert('코멘트를 입력하세요.');
                    return;
                }

                if (!post.replies) post.replies = [];
                post.replies.push({
                    name: name,
                    title: title,
                    comment: comment,
                    url: url,
                    color: selectedColor,
                    number: randomNum(),
                    timestamp: Date.now(),
                    image: null
                });

                form.remove();
                renderPosts();
            });

            postEl.appendChild(form);
        }

        document.getElementById('submitPost').addEventListener('click', () => {
            const name = document.getElementById('fieldName').value.trim();
            const title = document.getElementById('fieldTitle').value.trim();
            const comment = document.getElementById('fieldComment').value.trim();
            const url = document.getElementById('fieldUrl').value.trim();

            if (!name || !title || !comment) {
                alert('이름, 제목, 코멘트를 입력하세요.');
                return;
            }

            const imgRadio = document.querySelector('#imagesList input[name="img"]:checked');
            const image = imgRadio ? imgRadio.value : null;

            const post = {
                name: name,
                title: title,
                comment: comment,
                url: url === 'http(s)://' ? '' : url,
                image: image,
                color: selectedColor,
                number: randomNum(),
                timestamp: Date.now(),
                replies: []
            };

            posts.unshift(post);
            renderPosts();

            document.getElementById('fieldName').value = '';
            document.getElementById('fieldTitle').value = '';
            document.getElementById('fieldComment').value = '';
            document.getElementById('fieldUrl').value = 'http(s)://';
            document.querySelectorAll('#imagesList input[name="img"]').forEach(r => r.checked = false);
            document.querySelectorAll('#imagesList .img-choice').forEach(l => l.classList.remove('selected'));
        });
    </script>
</body>
</html>
