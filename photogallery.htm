        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        #image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
            line-height: 0;
        }
        #image-container img {
            display: block;
            width: 45%;
            max-width: 550px;
            height: auto;
            margin: 0 auto;
            transform: translateX(-5px);
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 110px;
            height: 20px;
        }
        .nav-overlay a:nth-child(1) { right: 34%; top: 0%; }
        .nav-overlay a:nth-child(2) { right: 34%; top: 18%; }
        .nav-overlay a:nth-child(3) { right: 34%; top: 32%; }
        .nav-overlay a:nth-child(4) { right: 34%; top: 46%; }
        .nav-overlay a:nth-child(5) { right: 34%; top: 60%; }
        .nav-overlay a:nth-child(6) { right: 34%; top: 74%; }

        .top-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 55%;
            max-width: 600px;
            margin: 60px auto 0 auto;
            padding: 0;
            position: relative;
        }
        .photos-center {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            line-height: 0;
        }
        .photos-center img {
            display: block;
            width: 110px;
            height: auto;
        }

        .gallery-panel {
            background-color: #ffffff;
            color: #000;
            padding: 15px 18px;
            width: 55%;
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #00008b;
            border-bottom: 2px solid #00008b;
            min-height: 600px;
        }

        .member-select {
            position: relative;
            margin-bottom: 12px;
        }
        .member-btn {
            background-color: #ffffff;
            color: #000;
            border: 1px solid #000;
            padding: 1px 5px;
            font-family: "Gulim", "Arial", sans-serif;
            font-size: 9px;
            cursor: pointer;
            min-width: 60px;
            text-align: left;
        }
        .member-btn:hover {
            background-color: #f0f0f0;
        }
        .member-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            border: 1px solid #000;
            min-width: 60px;
            z-index: 20;
        }
        .member-dropdown.open {
            display: block;
        }
        .member-dropdown a {
            display: block;
            padding: 1px 5px;
            font-family: "Gulim", "Arial", sans-serif;
            font-size: 9px;
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
        .member-dropdown a:hover {
            background-color: #00008b;
            color: #ffffff;
        }

        .photos-grid {
            display: none;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
        }
        .photos-grid.active {
            display: flex;
        }
        .photos-grid a {
            display: block;
            line-height: 0;
        }
        .photos-grid img {
            display: block;
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid #000;
        }

        @media (max-width: 768px) {
            .gallery-panel, .top-row {
                width: 85%;
                max-width: 600px;
            }
            .top-row {
                margin: 55px auto 0 auto;
            }
            #image-container img {
                width: 60%;
                max-width: 450px;
                transform: translateX(-4px);
            }
            .nav-overlay a {
                width: 90px;
                height: 16px;

            .nav-overlay a:nth-child(1) { right: 26%; top: 0%; }
            .nav-overlay a:nth-child(2) { right: 26%; top: 18%; }
            .nav-overlay a:nth-child(3) { right: 26%; top: 32%; }
            .nav-overlay a:nth-child(4) { right: 26%; top: 46%; }
            .nav-overlay a:nth-child(5) { right: 26%; top: 60%; }
            .nav-overlay a:nth-child(6) { right: 26%; top: 74%; }
            .photos-grid img {
                width: 80px;
                height: 80px;
            }
        }
        @media (max-width: 500px) {
            .gallery-panel, .top-row {
                width: 95%;
            }
            .top-row {
                margin: 50px auto 0 auto;
            }
            #image-container img {
                width: 75%;
                max-width: 350px;
                transform: translateX(-3px);
            }

                width: 70px;
                height: 12px;

            .nav-overlay a:nth-child(3) { right: 20%; top: 32%; }

            .nav-overlay a:nth-child(5) { right: 20%; top: 60%; }
            .nav-overlay a:nth-child(6) { right: 20%; top: 74%; }
            .photos-center img {
                width: 80px;
            }
            .photos-grid img {
                width: 60px;
                height: 60px;
            }
            .member-btn {
                min-width: 50px;
                font-size: 8px;
            }
            .member-dropdown {
                min-width: 50px;
            }
            .member-dropdown a {
                font-size: 8px;
            }
        }
    </style>

    <script>
        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById('memberDropdown').classList.toggle('open');
        }

        function showPhotos(prefix) {
            const grids = document.querySelectorAll('.photos-grid');
            grids.forEach(g => g.classList.remove('active'));
            document.getElementById('grid-' + prefix).classList.add('active');
            document.getElementById('memberDropdown').classList.remove('open');
        }

        document.addEventListener('click', function(e) {
            const dd = document.getElementById('memberDropdown');
            if (dd.classList.contains('open') && !e.target.closest('.member-select')) {
                dd.classList.remove('open');
            }
        });
    </script>
