<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Flash · BabyVoxel</title>
    <!-- Ruffle CDN (последняя стабильная версия) -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.1.0/ruffle.min.js"></script>
    <style>
        /* Глобальный сброс и центрирование */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1e2c; /* тёмный фон, чтобы выделить контент */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }

        .flash-container {
            background: #0b0d14;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            transition: all 0.2s ease;
        }

        /* Ruffle-обёртка для SWF */
        #ruffle-player {
            width: 800px;
            max-width: 100%;
            aspect-ratio: 4 / 3; /* классическое соотношение, подгоняется под SWF */
            background: #0f111c;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px #2a2f40, 0 8px 24px rgba(0,0,0,0.7);
        }

        #ruffle-player ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* подпись / информация (необязательно, но добавляет акцент) */
        .flash-label {
            margin-top: 18px;
            color: #9aa1b9;
            font-size: 0.9rem;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: #1e2332;
            padding: 8px 22px;
            border-radius: 60px;
            border: 1px solid #2d3348;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-weight: 500;
        }

        .flash-label span {
            color: #c8cee8;
            font-weight: 600;
        }

        /* Адаптив для маленьких экранов */
        @media (max-width: 640px) {
            .flash-container {
                padding: 12px;
                border-radius: 20px;
            }
            #ruffle-player {
                border-radius: 14px;
                aspect-ratio: 4 / 3;
            }
            .flash-label {
                font-size: 0.7rem;
                padding: 6px 16px;
                margin-top: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="flash-container">
        <!-- контейнер, куда Ruffle встроит SWF -->
        <div id="ruffle-player">
            <!-- Ruffle автоматически заменит этот элемент на <ruffle-player> -->
        </div>
        <div class="flash-label">
            ⚡ <span>babyvoxelllmainTEST2.swf</span> · Ruffle эмуляция
        </div>
    </div>

    <script>
        (function() {
            // Дожидаемся полной загрузки DOM и скрипта Ruffle
            if (typeof window.RufflePlayer !== 'undefined') {
                initRuffle();
            } else {
                // Если Ruffle ещё не загрузился, подписываемся на событие
                window.addEventListener('load', function() {
                    // Небольшая задержка, чтобы Ruffle успел инициализироваться
                    setTimeout(initRuffle, 200);
                });
            }

            function initRuffle() {
                try {
                    // Получаем контейнер, куда будем встраивать плеер
                    const container = document.getElementById('ruffle-player');
                    if (!container) {
                        console.error('Контейнер #ruffle-player не найден');
                        return;
                    }

                    // Проверяем, существует ли RufflePlayer (глобальный объект)
                    if (typeof window.RufflePlayer === 'undefined') {
                        console.warn('RufflePlayer не загружен. Повторная попытка через 500ms...');
                        setTimeout(initRuffle, 500);
                        return;
                    }

                    // Создаём экземпляр плеера
                    const ruffle = window.RufflePlayer.newest();
                    if (!ruffle) {
                        console.error('Не удалось создать экземпляр RufflePlayer');
                        return;
                    }

                    // Настраиваем параметры плеера (опционально)
                    const player = ruffle.createPlayer(container, {
                        // Параметры эмуляции: можно указать качество, масштаб и т.д.
                        // В данном случае используем стандартные настройки.
                        // Параметры, которые могут быть полезны:
                        // letterbox: "on" | "off" | "fullscreen" — поведение при несовпадении пропорций
                        // backgroundColor: "#0b0d14" — фон, если SWF не заполняет всю область
                        // autoplay: "on" — автозапуск (по умолчанию on)
                        // quality: "high" | "medium" | "low"
                        // scale: "showAll" | "noBorder" | "exactFit" — аналогично встроенному плееру
                        // Но для простоты оставим как есть, Ruffle сам подберёт разумные настройки
                    });

                    // Загружаем SWF файл (имя файла должно соответствовать тому, что лежит рядом с index.html)
                    // Важно: файл babyvoxelllmainTEST2.swf должен находиться в той же папке, что и index.html
                    const swfUrl = 'babyvoxelllmainTEST2.swf';

                    // Пытаемся загрузить SWF
                    player.load(swfUrl).then(() => {
                        console.log('✅ SWF успешно загружен:', swfUrl);
                    }).catch((error) => {
                        console.error('❌ Ошибка загрузки SWF:', error);
                        // Показываем сообщение об ошибке прямо в контейнере
                        container.innerHTML = `
                            <div style="display:flex; align-items:center; justify-content:center; height:100%; 
                                 color:#ec7a7a; background:#161a26; border-radius:20px; padding:20px; 
                                 flex-direction:column; gap:12px; font-family:system-ui; text-align:center;">
                                <div style="font-size:2.5rem; opacity:0.6;">⚠️</div>
                                <div style="max-width:300px; font-weight:400; line-height:1.5;">
                                    Не удалось загрузить <strong>babyvoxelllmainTEST2.swf</strong><br>
                                    <span style="font-size:0.85rem; color:#9aa1b9;">убедитесь, что файл находится в той же папке</span>
                                </div>
                                <div style="font-size:0.8rem; background:#1f2537; padding:6px 16px; border-radius:40px; 
                                     color:#b6bdd6; border:1px solid #2e344a; margin-top:6px;">
                                    ${error.message || 'Ошибка загрузки'}
                                </div>
                            </div>
                        `;
                    });
                } catch (e) {
                    console.error('Исключение при инициализации Ruffle:', e);
                }
            }
        })();
    </script>
</body>
</html>
