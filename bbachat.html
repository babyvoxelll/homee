<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        #image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
            line-height: 0;
        }
        #image-container img {
            display: block;
            width: 45%;
            max-width: 550px;
            height: auto;
            aspect-ratio: auto;
            object-fit: scale-down;
            margin: 0 auto;
            transform: scaleY(0.75);
            transform-origin: top center;
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 110px;
            height: 20px;
        }
        .nav-overlay a:nth-child(1) { right: 36%; top: 8%; }
        .nav-overlay a:nth-child(2) { right: 36%; top: 17%; }
        .nav-overlay a:nth-child(3) { right: 36%; top: 26%; }
        .nav-overlay a:nth-child(4) { right: 36%; top: 35%; }
        .nav-overlay a:nth-child(5) { right: 36%; top: 44%; }
        .nav-overlay a:nth-child(6) { right: 36%; top: 53%; }
        .nav-overlay a:nth-child(7) { right: 36%; top: 62%; }

        .bbachat-wrapper {
            width: 55%;
            max-width: 700px;
            margin: 15px auto 0 auto;
            padding: 20px;
            background: #404040;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .bbachat-left {
            flex: 1;
            background: #404040;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }
        .bbachat-header {
            background: #800020;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 8px;
            display: grid;
            grid-template-columns: 50px 1fr 70px 100px 120px;
            gap: 4px;
            text-align: center;
        }
        .bbachat-messages {
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            max-height: 460px;
        }
        .bbachat-row {
            display: grid;
            grid-template-columns: 50px 1fr 70px 100px 120px;
            gap: 4px;
            padding: 6px 8px;
            background: #d0d0d0;
            font-size: 12px;
            align-items: center;
            text-align: center;
            word-wrap: break-word;
        }
        .bbachat-row .msg-cell {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .bbachat-row .msg-cell img.new-icon {
            width: 22px;
            height: auto;
        }
        .bbachat-row .file-cell img {
            width: 28px;
            height: auto;
        }
        .bbachat-pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px 0;
            background: #404040;
            flex-wrap: wrap;
        }
        .bbachat-pagination button {
            background: #800020;
            color: #fff;
            border: 1px solid #fff;
            padding: 3px 9px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .bbachat-pagination button.active {
            background: #fff;
            color: #800020;
        }
        .bbachat-pagination button:hover {
            opacity: 0.85;
        }

        .bbachat-form {
            width: 200px;
            background: #d0d0d0;
            padding: 12px;
            flex-shrink: 0;
        }
        .bbachat-form .form-title {
            font-size: 12px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            text-align: center;
        }
        .bbachat-form label {
            display: block;
            font-size: 12px;
            color: #000;
            margin-bottom: 2px;
            margin-top: 8px;
        }
        .bbachat-form input[type="text"],
        .bbachat-form input[type="file"] {
            width: 100%;
            font-size: 12px;
            padding: 4px;
            border: 1px solid #888;
            background: #fff;
        }
        .bbachat-form button {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
        .bbachat-form button:hover {
            background: #a00028;
        }
        .gif-picker {
            display: none;
            background: #fff;
            border: 1px solid #888;
            margin-top: 4px;
            padding: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        .gif-picker.open {
            display: block;
        }
        .gif-picker .gif-item {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: #eee;
            margin: 2px;
            cursor: pointer;
            border: 1px solid #ccc;
            font-size: 10px;
            text-align: center;
            line-height: 60px;
            color: #888;
        }
        .gif-picker .gif-empty {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 10px;
        }
        .gif-preview {
            margin-top: 4px;
            font-size: 11px;
            color: #000;
        }

        @media (max-width: 768px) {
            .bbachat-wrapper {
                width: 85%;
                flex-direction: column;
            }
            .bbachat-form {
                width: 100%;
            }
            #image-container img {
                width: 60%;
                max-width: 450px;
                transform: scaleY(0.75);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 90px;
                height: 16px;
            }
            .nav-overlay a:nth-child(1) { right: 29%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 29%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 29%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 29%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 29%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 29%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 29%; top: 62%; }
        }
        @media (max-width: 500px) {
            .bbachat-wrapper {
                width: 95%;
            }
            .bbachat-header,
            .bbachat-row {
                grid-template-columns: 35px 1fr 55px 70px 80px;
                font-size: 10px;
            }
            #image-container img {
                width: 75%;
                max-width: 350px;
                transform: scaleY(0.7);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 70px;
                height: 12px;
            }
            .nav-overlay a:nth-child(1) { right: 22%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 22%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 22%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 22%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 22%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 22%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 22%; top: 62%; }
        }
    </style>
</head>
<body>
    <div id="image-container">
        <img src="bbachat.jpg" alt="bbachat">
        <div class="nav-overlay">
            <a href="videos.html"></a>
            <a href="index.html"></a>
            <a href="profiles.html"></a>
            <a href="discography.html"></a>
            <a href="history.html"></a>
            <a href="bbachat.html"></a>
            <a href="photogallery.html"></a>
        </div>
    </div>

    <div class="bbachat-wrapper">
        <div class="bbachat-left">
            <div class="bbachat-header">
                <div>번호</div>
                <div>메시지</div>
                <div>파일</div>
                <div>이름</div>
                <div>등록일</div>
            </div>
            <div class="bbachat-messages" id="messages"></div>
            <div class="bbachat-pagination" id="pagination"></div>
        </div>

        <div class="bbachat-form">
            <div class="form-title">메시지 보내기</div>
            <label>이름</label>
            <input type="text" id="name" maxlength="20" required>
            <label>메시지 (최대 350자)</label>
            <input type="text" id="message" maxlength="350" required>
            <label>파일 (jpg/exe)</label>
            <input type="file" id="file" accept=".jpg,.jpeg,.exe">
            <label>기프</label>
            <button type="button" id="gifBtn">기프 선택</button>
            <div class="gif-picker" id="gifPicker">
                <div class="gif-empty">사용 가능한 기프가 없습니다</div>
            </div>
            <div class="gif-preview" id="gifPreview"></div>
            <button id="sendBtn">보내기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBxl0S2LbjmxRTOGlAc6KsxIWM_ID7trI",
            authDomain: "babyvox-chat.firebaseapp.com",
            databaseURL: "https://babyvox-chat-default-rtdb.firebaseio.com",
            projectId: "babyvox-chat",
            storageBucket: "babyvox-chat.firebasestorage.app",
            messagingSenderId: "741605907733",
            appId: "1:741605907733:web:9f0cdb69685ac0e4631d1c",
            measurementId: "G-V53X8WZ4YR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, "bbachat/messages");

        const PER_PAGE = 10;
        let currentPage = 1;
        let allMessages = [];
        let selectedGif = null;

        function getUserNumber() {
            let num = localStorage.getItem("bbachat_number");
            if (!num) {
                num = Math.floor(10000 + Math.random() * 90000).toString();
                localStorage.setItem("bbachat_number", num);
            }
            return num;
        }

        function buildRow(data) {
            const row = document.createElement("div");
            row.className = "bbachat-row";

            const numCell = document.createElement("div");
            numCell.textContent = data.number || "";

            const msgCell = document.createElement("div");
            msgCell.className = "msg-cell";

            if (data.timestamp) {
                const age = Date.now() - data.timestamp;
                if (age < 24 * 60 * 60 * 1000) {
                    const newImg = document.createElement("img");
                    newImg.src = "new.gif";
                    newImg.className = "new-icon";
                    newImg.alt = "new";
                    msgCell.appendChild(newImg);
                }
            }

            const msgText = document.createElement("span");
            msgText.textContent = data.message || "";
            msgCell.appendChild(msgText);

            if (data.gif) {
                const gifImg = document.createElement("img");
                gifImg.src = data.gif;
                gifImg.style.width = "40px";
                gifImg.style.height = "auto";
                gifImg.style.marginLeft = "6px";
                msgCell.appendChild(gifImg);
            }

            const fileCell = document.createElement("div");
            fileCell.className = "file-cell";
            if (data.fileType === "jpg") {
                const img = document.createElement("img");
                img.src = "JPG.gif";
                img.alt = "JPG";
                fileCell.appendChild(img);
            } else if (data.fileType === "exe") {
                const img = document.createElement("img");
                img.src = "EXE.gif";
                img.alt = "EXE";
                fileCell.appendChild(img);
            }

            const nameCell = document.createElement("div");
            nameCell.textContent = data.name || "";

            const dateCell = document.createElement("div");
            if (data.timestamp) {
                const d = new Date(data.timestamp);
                const pad = (n) => n.toString().padStart(2, "0");
                dateCell.textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            row.appendChild(numCell);
            row.appendChild(msgCell);
            row.appendChild(fileCell);
            row.appendChild(nameCell);
            row.appendChild(dateCell);

            return row;
        }

        function renderPage() {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = allMessages.slice(start, start + PER_PAGE);
            pageItems.forEach((m) => container.appendChild(buildRow(m)));
        }

        function renderPagination() {
            const pag = document.getElementById("pagination");
            pag.innerHTML = "";
            const totalPages = Math.ceil(allMessages.length / PER_PAGE) || 1;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                if (i === currentPage) btn.classList.add("active");
                btn.addEventListener("click", () => {
                    currentPage = i;
                    renderPage();
                    renderPagination();
                });
                pag.appendChild(btn);
            }
        }

        onValue(messagesRef, (snapshot) => {
            allMessages = [];
            snapshot.forEach((child) => {
                allMessages.push(child.val());
            });
            allMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            const totalPages = Math.ceil(allMessages.length / PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderPage();
            renderPagination();
        });

        // GIF picker
        const gifBtn = document.getElementById("gifBtn");
        const gifPicker = document.getElementById("gifPicker");
        const gifPreview = document.getElementById("gifPreview");

        gifBtn.addEventListener("click", () => {
            gifPicker.classList.toggle("open");
        });

        // Пустой список — на будущее можно добавить гифки
        const availableGifs = [];
        if (availableGifs.length === 0) {
            gifPicker.innerHTML = '<div class="gif-empty">사용 가능한 기프가 없습니다</div>';
        } else {
            availableGifs.forEach((src) => {
                const item = document.createElement("div");
                item.className = "gif-item";
                const img = document.createElement("img");
                img.src = src;
                img.style.maxWidth = "100%";
                img.style.maxHeight = "100%";
                item.appendChild(img);
                item.addEventListener("click", () => {
                    selectedGif = src;
                    gifPreview.textContent = "선택됨: " + src;
                    gifPicker.classList.remove("open");
                });
                gifPicker.appendChild(item);
            });
        }

        // Send
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const message = document.getElementById("message").value.trim();
            const fileInput = document.getElementById("file");

            if (!name || !message) {
                alert("이름과 메시지를 입력하세요.");
                return;
            }
            if (message.length > 350) {
                alert("메시지는 최대 350자까지 입력할 수 있습니다.");
                return;
            }

            let fileType = null;
            if (fileInput.files && fileInput.files.length > 0) {
                const fname = fileInput.files[0].name.toLowerCase();
                if (fname.endsWith(".jpg") || fname.endsWith(".jpeg")) {
                    fileType = "jpg";
                } else if (fname.endsWith(".exe")) {
                    fileType = "exe";
                } else {
                    alert("jpg 또는 exe 파일만 업로드할 수 있습니다.");
                    return;
                }
            }

            const userNumber = getUserNumber();

            await push(messagesRef, {
                number: userNumber,
                message: message,
                name: name,
                fileType: fileType,
                gif: selectedGif || null,
                timestamp: Date.now()
            });

            document.getElementById("message").value = "";
            document.getElementById("file").value = "";
            selectedGif = null;
            gifPreview.textContent = "";
        });
    </script>
</body>
</html>
