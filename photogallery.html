<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - Photogallery</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }
        #image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
            line-height: 0;
        }
        #image-container img {
            display: block;
            width: 45%;
            max-width: 550px;
            height: auto;
            aspect-ratio: auto;
            object-fit: scale-down;
            margin: 0 auto;
            transform: scaleY(0.75);
            transform-origin: top center;
        }
        .nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            width: 110px;
            height: 20px;
        }
        .nav-overlay a:nth-child(1) { right: 36%; top: 8%; }
        .nav-overlay a:nth-child(2) { right: 36%; top: 17%; }
        .nav-overlay a:nth-child(3) { right: 36%; top: 26%; }
        .nav-overlay a:nth-child(4) { right: 36%; top: 35%; }
        .nav-overlay a:nth-child(5) { right: 36%; top: 44%; }
        .nav-overlay a:nth-child(6) { right: 36%; top: 53%; }
        .nav-overlay a:nth-child(7) { right: 36%; top: 62%; }

        .photos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 55%;
            max-width: 600px;
            margin: 10px auto 0 auto;
            padding: 0;
            line-height: 0;
        }
        .photos-container img {
            display: block;
            width: 30%;
            max-width: 160px;
            height: auto;
        }
        .gallery-container {
            width: 55%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .member-menu {
            flex-shrink: 0;
            width: 130px;
            background-color: #ffffff;
            border: 2px solid #00008b;
            padding: 6px 4px;
        }
        .member-menu-title {
            font-size: 10px;
            font-weight: bold;
            color: #000;
            text-align: center;
            cursor: pointer;
            padding: 4px 0;
            user-select: none;
        }
        .member-menu-title:hover {
            color: #00008b;
        }
        .member-menu-list {
            display: none;
            flex-direction: column;
            margin-top: 4px;
        }
        .member-menu-list.open {
            display: flex;
        }
        .member-menu-list a {
            display: block;
            font-size: 9px;
            color: #00008b;
            text-decoration: none;
            padding: 3px 4px;
            text-align: left;
            cursor: pointer;
        }
        .member-menu-list a:hover {
            background-color: #00008b;
            color: #fff;
        }
        .gallery-panel {
            flex: 1;
            background-color: #ffffff;
            border: 2px solid #00008b;
            min-height: 600px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }
        .gallery-panel .photo-thumb {
            width: 70px;
            height: auto;
            display: block;
            border: 1px solid #000;
            cursor: pointer;
            object-fit: cover;
        }
        .gallery-panel .photo-thumb img {
            width: 100%;
            height: auto;
            display: block;
        }
        .gallery-panel .empty-msg {
            font-size: 10px;
            color: #888;
            padding: 6px;
        }

        @media (max-width: 768px) {
            .photos-container {
                width: 85%;
                max-width: 600px;
            }
            .gallery-container {
                width: 85%;
                max-width: 600px;
            }
            #image-container img {
                width: 60%;
                max-width: 450px;
                transform: scaleY(0.75);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 90px;
                height: 16px;
            }
            .nav-overlay a:nth-child(1) { right: 29%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 29%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 29%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 29%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 29%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 29%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 29%; top: 62%; }
        }
        @media (max-width: 500px) {
            .photos-container {
                width: 95%;
            }
            .gallery-container {
                width: 95%;
            }
            #image-container img {
                width: 75%;
                max-width: 350px;
                transform: scaleY(0.7);
                transform-origin: top center;
            }
            .nav-overlay a {
                width: 70px;
                height: 12px;
            }
            .nav-overlay a:nth-child(1) { right: 22%; top: 8%; }
            .nav-overlay a:nth-child(2) { right: 22%; top: 17%; }
            .nav-overlay a:nth-child(3) { right: 22%; top: 26%; }
            .nav-overlay a:nth-child(4) { right: 22%; top: 35%; }
            .nav-overlay a:nth-child(5) { right: 22%; top: 44%; }
            .nav-overlay a:nth-child(6) { right: 22%; top: 53%; }
            .nav-overlay a:nth-child(7) { right: 22%; top: 62%; }
            .member-menu {
                width: 110px;
            }
            .gallery-panel .photo-thumb {
                width: 55px;
            }
        }
    </style>
</head>
<body>
    <div id="image-container">
        <img src="photogallery.jpg" alt="photogallery">
        <div class="nav-overlay">
            <a href="videos.html"></a>
            <a href="index.html"></a>
            <a href="profiles.html"></a>
            <a href="discography.html"></a>
            <a href="history.html"></a>
            <a href="bbachat.html"></a>
            <a href="photogallery.html"></a>
        </div>
    </div>
    
    <div class="photos-container">
        <img src="photos.jpg" alt="photos">
    </div>
    
    <div class="gallery-container">
        <div class="member-menu">
            <div class="member-menu-title" onclick="toggleMenu()">멤버 선택</div>
            <div class="member-menu-list" id="memberList">
                <a onclick="showPhotos('ez')">Kim E-Z</a>
                <a onclick="showPhotos('hee')">Lee Heejin</a>
                <a onclick="showPhotos('eun')">Shim Eunjin</a>
                <a onclick="showPhotos('mi')">Kan Miyoun</a>
                <a onclick="showPhotos('hye')">Yoon Eunhye</a>
                <a onclick="showPhotos('bbvox')">Baby V.O.X</a>
            </div>
        </div>
        <div class="gallery-panel" id="galleryPanel">
            <div class="empty-msg">왼쪽에서 멤버를 선택하세요</div>
        </div>
    </div>

    <script>
        const galleries = {
            ez: ['ez1.jpg', 'ez2.jpg', 'ez3.jpg', 'ez4.jpg'],
            hee: ['hee1.jpg', 'hee2.jpg', 'hee3.jpg', 'hee4.jpg'],
            eun: ['eun1.jpg', 'eun2.jpg', 'eun3.jpg', 'eun4.jpg'],
            mi: ['mi1.jpg', 'mi2.jpg', 'mi3.jpg', 'mi4.jpg'],
            hye: ['hye1.jpg', 'hye2.jpg', 'hye3.jpg', 'hye4.jpg'],
            bbvox: ['bbvox1.jpg', 'bbvox2.jpg', 'bbvox3.jpg', 'bbvox4.jpg']
        };

        function toggleMenu() {
            document.getElementById('memberList').classList.toggle('open');
        }

        function showPhotos(key) {
            const panel = document.getElementById('galleryPanel');
            panel.innerHTML = '';
            const list = galleries[key] || [];
            list.forEach(file => {
                const wrap = document.createElement('a');
                wrap.href = file;
                wrap.className = 'photo-thumb';
                const img = document.createElement('img');
                img.src = file;
                img.alt = '';
                wrap.appendChild(img);
                panel.appendChild(wrap);
            });
            document.getElementById('memberList').classList.remove('open');
        }
    </script>
</body>
</html>
