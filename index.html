<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a3b1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, 'Mona12', monospace;
            box-sizing: border-box;
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        #player-container {
            width: 800px;
            max-width: 100%;
            height: 600px;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            flex-shrink: 0;
        }
        .info-text {
            color: #000000;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            max-width: 800px;
            width: 100%;
            word-break: break-word;
            background-color: transparent;
            padding: 0 10px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, 'Mona12', monospace;
        }
        .info-text .dark-green {
            color: #1a3b1a;
        }
        .info-text .light-green {
            color: #90ee90;
        }
        .info-text .email-green {
            color: #7cfc00;
        }
        @media (max-width: 820px) {
            #player-container {
                width: 100%;
                height: 60vh;
                max-height: 500px;
            }
            .info-text {
                font-size: 11px;
            }
        }
        @media (max-width: 480px) {
            .info-text {
                font-size: 10px;

    </style>
</head>
<body>
    <div class="main-wrapper">
        <div id="player-container"></div>
        <div class="info-text">

            <br>
            <span class="dark-green">이메일: </span><span class="email-green">kazemorcihelp@gmail.com</span>

    <script src="https://unpkg.com/@ruffle-rs/ruffle@latest/ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            let ruffle = window.RufflePlayer.newest();
            let player = ruffle.createPlayer();
            let container = document.getElementById("player-container");
            container.innerHTML = '';
            container.appendChild(player);
            player.load({
                url: "babyvoxelllmain.swf"
            });
        });
