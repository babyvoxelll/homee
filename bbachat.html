<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #990033;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bbachat-outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: -200px auto 0 auto;
            width: 1000px;
            max-width: 1000px;
        }

        .bbachat-top-imgs {
            position: relative;
            width: 1000px;
            height: 420px;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .bbachat-top-imgs img.bbvoxpanel {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 520px;
            max-width: 520px;
            height: auto;
            display: block;
        }
        .bbachat-top-imgs img.panel {
            position: absolute;
            left: 280px;
            bottom: 0;
            width: 720px;
            max-width: 720px;
            height: auto;
            display: block;
            z-index: 2;
        }

        .nav-overlay {
            position: absolute;
            left: 280px;
            bottom: 0;
            width: 720px;
            height: 420px;
            pointer-events: none;
            z-index: 10;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.001);
            border: none;
            cursor: pointer;
            text-decoration: none;
            height: 22px;
        }
        .nav-overlay a:nth-child(1) { left: 0%;   bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(2) { left: 11%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(3) { left: 23%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(4) { left: 36%;  bottom: 2%; width: 80px; }
        .nav-overlay a:nth-child(5) { left: 52%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(6) { left: 65%;  bottom: 2%; width: 70px; }
        .nav-overlay a:nth-child(7) { left: 85%;  bottom: 2%; width: 85px; }

        .bbachat-wrapper {
            width: 1000px;
            max-width: 1000px;
            padding: 20px;
            background: #404040;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            justify-content: center;
            position: relative;
        }
        .bbachat-left {
            flex: 1;
            background: #404040;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 420px;
        }
        .bbachat-header {
            background: #800020;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 8px;
            display: grid;
            grid-template-columns: 50px 1fr 70px 100px 120px;
            gap: 4px;
            text-align: center;
            flex-shrink: 0;
        }
        .bbachat-messages {
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            max-height: 460px;
            flex: 1;
        }
        .bbachat-row {
            display: grid;
            grid-template-columns: 50px 1fr 70px 100px 120px;
            gap: 4px;
            padding: 6px 8px;
            background: #d0d0d0;
            font-size: 12px;
            align-items: center;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            min-width: 0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .bbachat-row:hover {
            background: #b8b8b8;
        }
        .bbachat-row > div {
            min-width: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .bbachat-row .msg-cell {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
        }
        .bbachat-row .msg-cell span {
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .bbachat-row .msg-cell img.new-icon {
            width: 18px;
            height: auto;
            flex-shrink: 0;
        }
        .bbachat-row .msg-cell img.gif-inline {
            width: 32px;
            height: auto;
            flex-shrink: 0;
            margin-left: 6px;
        }
        .bbachat-row .file-cell img {
            width: 14px;
            height: auto;
            display: inline-block;
        }
        .bbachat-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            background: #404040;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }
        .bbachat-pagination button {
            background: transparent;
            color: #fff;
            border: none;
            padding: 2px 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .bbachat-pagination button.active {
            color: #fff;
            background: transparent;
            text-decoration: underline;
        }
        .bbachat-pagination button:hover {
            color: #fff;
            opacity: 0.7;
        }

        .bbachat-form {
            width: 200px;
            background: #d0d0d0;
            padding: 12px;
            flex-shrink: 0;
        }
        .bbachat-form .form-title {
            font-size: 12px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
            text-align: center;
        }
        .bbachat-form label {
            display: block;
            font-size: 12px;
            color: #000;
            margin-bottom: 2px;
            margin-top: 8px;
        }
        .bbachat-form input[type="text"] {
            width: 100%;
            font-size: 12px;
            padding: 4px;
            border: 1px solid #888;
            background: #fff;
        }
        .bbachat-form input[type="file"] {
            display: none;
        }
        .form-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }
        .form-row .gif-toggle,
        .form-row .file-btn {
            flex: 1;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            padding: 4px 0;
            background: #eee;
            border: 1px solid #888;
        }
        .form-row .gif-toggle:hover,
        .form-row .file-btn:hover {
            background: #800020;
            color: #fff;
            border-color: #800020;
        }
        .form-row .gif-toggle.open {
            background: #800020;
            color: #fff;
            border-color: #800020;
        }

        .gif-picker {
            display: none;
            background: #fff;
            border: 1px solid #888;
            margin-top: 6px;
            padding: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        .gif-picker.open {
            display: block;
        }
        .gif-picker .gif-item {
            display: inline-block;
            margin: 2px;
            cursor: pointer;
            border: 1px solid #ccc;
            padding: 2px;
            background: #eee;
        }
        .gif-picker .gif-item img {
            width: 32px;
            height: auto;
            display: block;
        }
        .gif-picker .gif-item.selected {
            border-color: #800020;
            background: #ffe;
        }
        .gif-preview {
            margin-top: 4px;
            font-size: 11px;
            color: #000;
            min-height: 14px;
        }
        .gif-preview img {
            width: 28px;
            height: auto;
            vertical-align: middle;
            margin-right: 4px;
        }

        .bbachat-form button#sendBtn {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
        .bbachat-form button#sendBtn:hover {
            background: #a00028;
        }

        .bbachat-detail {
            display: none;
            flex: 1;
            background: #404040;
            min-width: 0;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            position: relative;
        }
        .bbachat-detail.open {
            display: flex;
        }
        .bbachat-detail .detail-back {
            position: absolute;
            top: 8px;
            left: 8px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            z-index: 5;
        }
        .bbachat-detail .detail-back:hover {
            opacity: 0.7;
        }
        .bbachat-detail .detail-panel {
            width: 100%;
            background: #800020;
            color: #fff;
            padding: 6px 8px;
            display: grid;
            grid-template-columns: 50px 1fr 70px 100px 120px;
            gap: 4px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }
        .bbachat-detail .detail-body {
            width: 100%;
            background: #d0d0d0;
            color: #000;
            font-size: 12px;
            padding: 10px 14px 14px 14px;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            min-width: 0;
        }
        .bbachat-detail .detail-body .detail-message {
            font-size: 13px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            margin-top: 6px;
        }
        .bbachat-detail .detail-body .detail-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto 0 auto;
        }
        .bbachat-detail .detail-body .detail-gif {
            max-width: 100px;
            height: auto;
            display: block;
            margin: 10px auto 0 auto;
        }
        .bbachat-detail .detail-body .detail-download {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background: #800020;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #555;
            cursor: pointer;
        }
        .bbachat-detail .detail-body .detail-download:hover {
            background: #a00028;
        }

        @media (max-width: 1100px) {
            .bbachat-outer {
                width: 90%;
                margin: -160px auto 0 auto;
            }
            .bbachat-wrapper {
                width: 100%;
            }
            .bbachat-top-imgs {
                width: 100%;
            }
        }
        @media (max-width: 900px) {
            .bbachat-wrapper {
                flex-direction: column;
            }
            .bbachat-form {
                width: 100%;
            }
            .bbachat-top-imgs {
                height: 280px;
            }
            .bbachat-top-imgs img.bbvoxpanel {
                width: 340px;
                max-width: 340px;
            }
            .bbachat-top-imgs img.panel {
                width: 460px;
                max-width: 460px;
                left: 180px;
            }
            .nav-overlay {
                left: 180px;
                width: 460px;
                height: 280px;
            }
            .nav-overlay a {
                width: 40px;
                height: 16px;
            }
        }
        @media (max-width: 500px) {
            .bbachat-outer {
                width: 95%;
                margin: -80px auto 0 auto;
            }
            .bbachat-header,
            .bbachat-row,
            .bbachat-detail .detail-panel {
                grid-template-columns: 35px 1fr 55px 70px 80px;
                font-size: 10px;
            }
            .bbachat-top-imgs {
                height: 200px;
            }
            .bbachat-top-imgs img.bbvoxpanel {
                width: 240px;
                max-width: 240px;
            }
            .bbachat-top-imgs img.panel {
                width: 320px;
                max-width: 320px;
                left: 120px;
            }
            .nav-overlay {
                left: 120px;
                width: 320px;
                height: 200px;
            }
            .nav-overlay a {
                width: 30px;
                height: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="bbachat-outer">
        <div class="bbachat-top-imgs">
            <img src="bbvoxpanel.jpg" alt="bbvoxpanel" class="bbvoxpanel">
            <img src="panel.png" alt="panel" class="panel">
            <div class="nav-overlay">
                <a href="videos.html"></a>
                <a href="index.html"></a>
                <a href="profiles.html"></a>
                <a href="discography.html"></a>
                <a href="history.html"></a>
                <a href="bbachat.html"></a>
                <a href="photogallery.html"></a>
            </div>
        </div>

        <div class="bbachat-wrapper">
            <div class="bbachat-left" id="bbachatLeft">
                <div class="bbachat-header">
                    <div>번호</div>
                    <div>메시지</div>
                    <div>파일</div>
                    <div>이름</div>
                    <div>등록일</div>
                </div>
                <div class="bbachat-messages" id="messages"></div>
                <div class="bbachat-pagination" id="pagination"></div>
            </div>

            <div class="bbachat-form" id="bbachatForm">
                <div class="form-title">메시지 보내기</div>
                <label>이름</label>
                <input type="text" id="name" maxlength="20" required>
                <label>메시지 (최대 350자)</label>
                <input type="text" id="message" maxlength="350" required>

                <div class="form-row">
                    <span class="gif-toggle" id="gifBtn">기프</span>
                    <label for="file" class="file-btn">파일 선택</label>
                    <input type="file" id="file" accept=".jpg,.jpeg,.exe">
                </div>

                <div class="gif-picker" id="gifPicker"></div>
                <div class="gif-preview" id="gifPreview"></div>

                <button id="sendBtn">보내기</button>
            </div>

            <div class="bbachat-detail" id="bbachatDetail">
                <button class="detail-back" id="detailBack">←</button>
                <div class="detail-panel" id="detailPanel"></div>
                <div class="detail-body" id="detailBody"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBxl0S2LbjmxRTOGlAc6KsxIWM_ID7trI",
            authDomain: "babyvox-chat.firebaseapp.com",
            databaseURL: "https://babyvox-chat-default-rtdb.firebaseio.com",
            projectId: "babyvox-chat",
            storageBucket: "babyvox-chat.firebasestorage.app",
            messagingSenderId: "741605907733",
            appId: "1:741605907733:web:9f0cdb69685ac0e4631d1c",
            measurementId: "G-V53X8WZ4YR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, "bbachat/messages");

        const PER_PAGE = 10;
        let currentPage = 1;
        let allMessages = [];
        let selectedGif = null;

        function generateRandomNumber() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function buildRow(data) {
            const row = document.createElement("div");
            row.className = "bbachat-row";

            const numCell = document.createElement("div");
            numCell.textContent = data.number || "";

            const msgCell = document.createElement("div");
            msgCell.className = "msg-cell";

            if (data.timestamp) {
                const age = Date.now() - data.timestamp;
                if (age < 24 * 60 * 60 * 1000) {
                    const newImg = document.createElement("img");
                    newImg.src = "new.gif";
                    newImg.className = "new-icon";
                    newImg.alt = "new";
                    msgCell.appendChild(newImg);
                }
            }

            const msgText = document.createElement("span");
            msgText.textContent = data.message || "";
            msgCell.appendChild(msgText);

            if (data.gif) {
                const gifImg = document.createElement("img");
                gifImg.src = data.gif;
                gifImg.className = "gif-inline";
                gifImg.alt = "gif";
                msgCell.appendChild(gifImg);
            }

            const fileCell = document.createElement("div");
            fileCell.className = "file-cell";
            if (data.fileType === "jpg") {
                const img = document.createElement("img");
                img.src = "JPG.gif";
                img.alt = "JPG";
                fileCell.appendChild(img);
            } else if (data.fileType === "exe") {
                const img = document.createElement("img");
                img.src = "EXE.gif";
                img.alt = "EXE";
                fileCell.appendChild(img);
            }

            const nameCell = document.createElement("div");
            nameCell.textContent = data.name || "";

            const dateCell = document.createElement("div");
            if (data.timestamp) {
                const d = new Date(data.timestamp);
                const pad = (n) => n.toString().padStart(2, "0");
                dateCell.textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            row.appendChild(numCell);
            row.appendChild(msgCell);
            row.appendChild(fileCell);
            row.appendChild(nameCell);
            row.appendChild(dateCell);

            row.addEventListener("click", () => {
                showDetail(data);
            });

            return row;
        }

        function showDetail(data) {
            document.getElementById("bbachatForm").style.display = "none";
            document.getElementById("bbachatLeft").style.display = "none";
            const detail = document.getElementById("bbachatDetail");
            detail.classList.add("open");

            const panel = document.getElementById("detailPanel");
            panel.innerHTML = "";

            const numCell = document.createElement("div");
            numCell.textContent = data.number || "";
            panel.appendChild(numCell);

            const msgCell = document.createElement("div");
            msgCell.textContent = data.message || "";
            panel.appendChild(msgCell);

            const fileCell = document.createElement("div");
            fileCell.textContent = data.fileType === "jpg" ? "JPG" : (data.fileType === "exe" ? "EXE" : "");
            panel.appendChild(fileCell);

            const nameCell = document.createElement("div");
            nameCell.textContent = data.name || "";
            panel.appendChild(nameCell);

            const dateCell = document.createElement("div");
            if (data.timestamp) {
                const d = new Date(data.timestamp);
                const pad = (n) => n.toString().padStart(2, "0");
                dateCell.textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }
            panel.appendChild(dateCell);

            const body = document.getElementById("detailBody");
            body.innerHTML = "";

            const messageDiv = document.createElement("div");
            messageDiv.className = "detail-message";
            messageDiv.textContent = data.message || "";
            body.appendChild(messageDiv);

            if (data.gif) {
                const gifImg = document.createElement("img");
                gifImg.src = data.gif;
                gifImg.className = "detail-gif";
                gifImg.alt = "gif";
                body.appendChild(gifImg);
            }

            if (data.fileType === "jpg") {
                const img = document.createElement("img");
                img.src = "JPG.gif";
                img.className = "detail-image";
                img.alt = "jpg";
                body.appendChild(img);
            } else if (data.fileType === "exe") {
                const link = document.createElement("a");
                link.href = "#";
                link.className = "detail-download";
                link.textContent = "EXE 파일 다운로드";
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    alert("파일 다운로드는 준비 중입니다.");
                });
                body.appendChild(link);
            }
        }

        document.getElementById("detailBack").addEventListener("click", () => {
            document.getElementById("bbachatDetail").classList.remove("open");
            document.getElementById("bbachatForm").style.display = "block";
            document.getElementById("bbachatLeft").style.display = "flex";
        });

        function renderPage() {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = allMessages.slice(start, start + PER_PAGE);
            pageItems.forEach((m) => container.appendChild(buildRow(m)));
        }

        function renderPagination() {
            const pag = document.getElementById("pagination");
            pag.innerHTML = "";
            const totalPages = Math.ceil(allMessages.length / PER_PAGE);
            if (allMessages.length < PER_PAGE) return;

            const maxNumbers = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxNumbers / 2));
            let endPage = startPage + maxNumbers - 1;

            if (endPage > totalPages) {
                endPage = totalPages;
                startPage = Math.max(1, endPage - maxNumbers + 1);
            }

            if (startPage > 1) {
                const prev = document.createElement("button");
                prev.textContent = "←";
                prev.addEventListener("click", () => {
                    currentPage = Math.max(1, currentPage - 1);
                    renderPage();
                    renderPagination();
                });
                pag.appendChild(prev);
            }

            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                if (i === currentPage) btn.classList.add("active");
                btn.addEventListener("click", () => {
                    currentPage = i;
                    renderPage();
                    renderPagination();
                });
                pag.appendChild(btn);
            }

            if (endPage < totalPages) {
                const next = document.createElement("button");
                next.textContent = "→";
                next.addEventListener("click", () => {
                    currentPage = Math.min(totalPages, currentPage + 1);
                    renderPage();
                    renderPagination();
                });
                pag.appendChild(next);
            }
        }

        onValue(messagesRef, (snapshot) => {
            allMessages = [];
            snapshot.forEach((child) => {
                allMessages.push(child.val());
            });
            allMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            const totalPages = Math.ceil(allMessages.length / PER_PAGE);
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
            if (allMessages.length < PER_PAGE) currentPage = 1;
            renderPage();
            renderPagination();
        });

        const gifBtn = document.getElementById("gifBtn");
        const gifPicker = document.getElementById("gifPicker");
        const gifPreview = document.getElementById("gifPreview");

        gifBtn.addEventListener("click", () => {
            gifPicker.classList.toggle("open");
            gifBtn.classList.toggle("open");
        });

        const availableGifs = [
            "1.gif", "2.gif", "3.gif", "4.gif", "5.gif", "6.gif",
            "7.gif", "8.gif", "9.gif", "10.gif", "11.gif", "12.gif"
        ];

        availableGifs.forEach((src) => {
            const item = document.createElement("div");
            item.className = "gif-item";
            const img = document.createElement("img");
            img.src = src;
            img.alt = "gif";
            item.appendChild(img);
            item.addEventListener("click", () => {
                document.querySelectorAll(".gif-picker .gif-item").forEach((el) => el.classList.remove("selected"));
                item.classList.add("selected");
                selectedGif = src;
                gifPreview.innerHTML = "";
                const previewImg = document.createElement("img");
                previewImg.src = src;
                gifPreview.appendChild(previewImg);
                const previewText = document.createElement("span");
                previewText.textContent = "선택됨";
                gifPreview.appendChild(previewText);
                gifPicker.classList.remove("open");
                gifBtn.classList.remove("open");
            });
            gifPicker.appendChild(item);
        });

        document.getElementById("sendBtn").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const message = document.getElementById("message").value.trim();
            const fileInput = document.getElementById("file");

            if (!name || !message) {
                alert("이름과 메시지를 입력하세요.");
                return;
            }
            if (message.length > 350) {
                alert("메시지는 최대 350자까지 입력할 수 있습니다.");
                return;
            }

            let fileType = null;
            if (fileInput.files && fileInput.files.length > 0) {
                const fname = fileInput.files[0].name.toLowerCase();
                if (fname.endsWith(".jpg") || fname.endsWith(".jpeg")) {
                    fileType = "jpg";
                } else if (fname.endsWith(".exe")) {
                    fileType = "exe";
                } else {
                    alert("jpg 또는 exe 파일만 업로드할 수 있습니다.");
                    return;
                }
            }

            const userNumber = generateRandomNumber();

            await push(messagesRef, {
                number: userNumber,
                message: message,
                name: name,
                fileType: fileType,
                gif: selectedGif || null,
                timestamp: Date.now()
            });

            document.getElementById("message").value = "";
            fileInput.value = "";
            selectedGif = null;
            gifPreview.innerHTML = "";
            document.querySelectorAll(".gif-picker .gif-item").forEach((el) => el.classList.remove("selected"));
        });
    </script>
</body>
</html>
