<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Community</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #990033;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bbachat-outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 auto 0 auto;
            width: 1000px;
            max-width: 1000px;
        }

        .bbacommunity-top {
            width: 1000px;
            max-width: 100%;
            line-height: 0;
            margin: 0 auto;
            padding: 0;
        }
        .bbacommunity-top img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .bbachat-top-imgs {
            position: relative;
            width: 1000px;
            max-width: 1000px;
            height: 420px;
            margin-top: -5px;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .bbachat-top-imgs img.bbvoxpanel {
            position: absolute;
            left: 0;
            top: 0;
            width: 520px;
            max-width: 520px;
            height: auto;
            display: block;
        }

        .nav-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 520px;
            height: 420px;
            pointer-events: none;
            z-index: 10;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.001);
            border: none;
            cursor: pointer;
            text-decoration: none;
            height: 22px;
        }
        .nav-overlay a:nth-child(1) { left: 2%;   top: 4%; width: 60px; }
        .nav-overlay a:nth-child(2) { left: 20%;  top: 4%; width: 60px; }
        .nav-overlay a:nth-child(3) { left: 40%;  top: 4%; width: 60px; }
        .nav-overlay a:nth-child(4) { left: 60%;  top: 4%; width: 80px; }
        .nav-overlay a:nth-child(5) { left: 2%;   top: 12%; width: 60px; }
        .nav-overlay a:nth-child(6) { left: 20%;  top: 12%; width: 70px; }
        .nav-overlay a:nth-child(7) { left: 40%;  top: 12%; width: 80px; }

        .bbachat-wrapper {
            width: 1000px;
            max-width: 1000px;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .write-form {
            background: #d0d0d0;
            border: 1px solid #555;
            padding: 20px 25px;
            width: 100%;
            max-width: 1000px;
        }
        .write-form .form-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            font-size: 13px;
            color: #000;
        }
        .write-form .form-row > label {
            width: 160px;
            flex-shrink: 0;
            text-align: right;
            padding-right: 15px;
            padding-top: 4px;
            font-weight: bold;
        }
        .write-form .form-row .field-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .write-form input[type="text"],
        .write-form input[type="email"] {
            width: 100%;
            max-width: 400px;
            padding: 4px 6px;
            border: 1px solid #888;
            background: #fff;
            font-size: 13px;
            font-family: inherit;
        }
        .write-form textarea {
            width: 100%;
            max-width: 700px;
            min-height: 120px;
            padding: 6px;
            border: 1px solid #888;
            background: #fff;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
        }

        .image-select-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .image-select-row .img-choice {
            cursor: pointer;
            border: 2px solid transparent;
            padding: 2px;
            background: #eee;
            line-height: 0;
        }
        .image-select-row .img-choice img {
            display: block;
            width: 80px;
            height: auto;
        }
        .image-select-row .img-choice.selected {
            border-color: #0000ee;
        }

        .color-select-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .color-select-row .color-choice {
            position: relative;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #888;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .color-select-row .color-choice .sq {
            width: 8px;
            height: 8px;
            position: absolute;
            bottom: -2px;
            right: -2px;
            border: 1px solid #333;
        }
        .color-select-row .color-choice.selected {
            border-color: #0000ee;
            box-shadow: 0 0 0 2px #0000ee;
        }

        .write-form .submit-row {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .write-form .submit-row button {
            padding: 8px 30px;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .write-form .submit-row button:hover {
            background: #a00028;
        }

        .chat-list {
            background: #fff;
            border: 1px solid #000;
            width: 100%;
            max-width: 1000px;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-thread {
            padding: 12px 15px;
            border-bottom: 4px solid #000;
        }
        .chat-thread:last-child {
            border-bottom: 4px solid #000;
        }

        .thread-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #999;
        }
        .thread-header .th-title {
            color: #004d00;
            font-weight: bold;
            font-size: 15px;
        }
        .thread-header .th-author {
            color: #000;
        }
        .thread-header .th-date {
            color: #555;
            font-size: 12px;
        }
        .thread-header .th-num {
            color: #555;
            font-size: 12px;
        }
        .thread-header .th-reply-btn {
            margin-left: auto;
            background: #eee;
            border: 1px solid #888;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            color: #000;
        }
        .thread-header .th-reply-btn:hover {
            background: #800020;
            color: #fff;
        }

        .thread-body {
            display: flex;
            gap: 15px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .thread-body .th-img {
            flex-shrink: 0;
            width: 120px;
            height: auto;
        }
        .thread-body .th-img img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ccc;
        }
        .thread-body .th-text {
            flex: 1;
            min-width: 200px;
            font-size: 13px;
            line-height: 1.6;
            color: #000;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .thread-body .th-text a {
            color: #0000ee;
            text-decoration: underline;
            word-break: break-all;
        }

        .thread-replies {
            margin-top: 10px;
            margin-left: 30px;
            padding-left: 12px;
            border-left: 2px dashed #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .reply-item {
            padding: 6px 0;
            border-bottom: 1px dashed #999;
            font-size: 12px;
        }
        .reply-item:last-child {
            border-bottom: none;
        }
        .reply-item .rp-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #555;
            margin-bottom: 4px;
            font-size: 11px;
        }
        .reply-item .rp-author {
            color: #000;
            font-weight: bold;
        }
        .reply-item .rp-text {
            color: #000;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .reply-form-inline {
            margin-top: 10px;
            margin-left: 30px;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #888;
            display: none;
        }
        .reply-form-inline.open {
            display: block;
        }
        .reply-form-inline .rf-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
            font-size: 12px;
        }
        .reply-form-inline .rf-row label {
            width: 70px;
            flex-shrink: 0;
        }
        .reply-form-inline .rf-row input {
            flex: 1;
            padding: 3px 5px;
            border: 1px solid #888;
            font-size: 12px;
            font-family: inherit;
        }
        .reply-form-inline .rf-row textarea {
            flex: 1;
            padding: 4px 5px;
            border: 1px solid #888;
            font-size: 12px;
            min-height: 50px;
            font-family: inherit;
            resize: vertical;
        }
        .reply-form-inline .rf-submit {
            text-align: right;
        }
        .reply-form-inline .rf-submit button {
            padding: 4px 16px;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        @media (max-width: 1100px) {
            .bbachat-outer {
                width: 95%;
            }
            .bbacommunity-top,
            .bbachat-top-imgs,
            .bbachat-wrapper,
            .write-form,
            .chat-list {
                width: 100%;
                max-width: 100%;
            }
        }
        @media (max-width: 900px) {
            .bbachat-top-imgs {
                height: 280px;
            }
            .bbachat-top-imgs img.bbvoxpanel {
                width: 340px;
                max-width: 340px;
            }
            .nav-overlay {
                width: 340px;
                height: 280px;
            }
            .write-form .form-row {
                flex-direction: column;
            }
            .write-form .form-row > label {
                width: 100%;
                text-align: left;
                padding-right: 0;
                margin-bottom: 4px;
            }
        }
        @media (max-width: 500px) {
            .bbachat-top-imgs {
                height: 200px;
            }
            .bbachat-top-imgs img.bbvoxpanel {
                width: 240px;
                max-width: 240px;
            }
            .nav-overlay {
                width: 240px;
                height: 200px;
            }
            .nav-overlay a {
                height: 14px;
            }
            .thread-body .th-img {
                width: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="bbachat-outer">
        <div class="bbacommunity-top">
            <img src="bbacommunity.jpg" alt="bbacommunity">
        </div>

        <div class="bbachat-top-imgs">
            <img src="bbvoxpanel.jpg" alt="bbvoxpanel" class="bbvoxpanel">
            <div class="nav-overlay">
                <a href="videos.html"></a>
                <a href="index.html"></a>
                <a href="profiles.html"></a>
                <a href="discography.html"></a>
                <a href="history.html"></a>
                <a href="bbachat.html"></a>
                <a href="photogallery.html"></a>
            </div>
        </div>

        <div class="bbachat-wrapper">
            <div class="write-form" id="writeForm">
                <div class="form-row">
                    <label>이름</label>
                    <div class="field-area">
                        <input type="text" id="inName" maxlength="30">
                    </div>
                </div>
                <div class="form-row">
                    <label>이메일</label>
                    <div class="field-area">
                        <input type="email" id="inEmail" maxlength="60">
                    </div>
                </div>
                <div class="form-row">
                    <label>제목</label>
                    <div class="field-area">
                        <input type="text" id="inTitle" maxlength="80">
                    </div>
                </div>
                <div class="form-row">
                    <label>코멘트</label>
                    <div class="field-area">
                        <textarea id="inComment"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <label>URL</label>
                    <div class="field-area">
                        <input type="text" id="inUrl" value="http(s)://" onfocus="if(this.value=='http(s)://'){this.value='';}" onblur="if(this.value==''){this.value='http(s)://';}">
                    </div>
                </div>
                <div class="form-row">
                    <label>이미지</label>
                    <div class="field-area">
                        <div class="image-select-row" id="imageSelectRow"></div>
                    </div>
                </div>
                <div class="form-row">
                    <label>글자색</label>
                    <div class="field-area">
                        <div class="color-select-row" id="colorSelectRow"></div>
                    </div>
                </div>
                <div class="submit-row">
                    <button id="submitBtn">등록</button>
                </div>
            </div>

            <div class="chat-list" id="chatList"></div>
        </div>
    </div>

    <script>
        const IMAGES = ["kimez.jpg", "leeheejin.jpg", "shimeunjin.jpg", "kanmiyoun.jpg", "yooneunhye.jpg"];
        const COLORS = [
            { name: "빨강", value: "#ff0000" },
            { name: "파랑", value: "#0000ff" },
            { name: "분홍", value: "#ff69b4" },
            { name: "초록", value: "#008000" },
            { name: "보라", value: "#800080" },
            { name: "갈색", value: "#8b4513" },
            { name: "검정", value: "#000000" },
            { name: "주황", value: "#ff8c00" }
        ];

        let selectedImage = null;
        let selectedColor = "#000000";
        let allThreads = [];

        function pad(n) { return n.toString().padStart(2, "0"); }

        function formatDate(ts) {
            const d = new Date(ts);
            const days = ["일", "월", "화", "수", "목", "금", "토"];
            return `${pad(d.getMonth()+1)}.${pad(d.getDate())}.${d.getFullYear()} (${days[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function randomNum() {
            return Math.floor(10000 + Math.random() * 90000);
        }

        function buildImageSelectors() {
            const row = document.getElementById("imageSelectRow");
            IMAGES.forEach((src) => {
                const wrap = document.createElement("div");
                wrap.className = "img-choice";
                const img = document.createElement("img");
                img.src = src;
                img.alt = src;
                wrap.appendChild(img);
                wrap.addEventListener("click", () => {
                    document.querySelectorAll("#imageSelectRow .img-choice").forEach(el => el.classList.remove("selected"));
                    wrap.classList.add("selected");
                    selectedImage = src;
                });
                row.appendChild(wrap);
            });
        }

        function buildColorSelectors() {
            const row = document.getElementById("colorSelectRow");
            COLORS.forEach((c) => {
                const wrap = document.createElement("div");
                wrap.className = "color-choice";
                wrap.style.background = c.value;
                wrap.title = c.name;
                const sq = document.createElement("div");
                sq.className = "sq";
                sq.style.background = c.value;
                wrap.appendChild(sq);
                wrap.addEventListener("click", () => {
                    document.querySelectorAll("#colorSelectRow .color-choice").forEach(el => el.classList.remove("selected"));
                    wrap.classList.add("selected");
                    selectedColor = c.value;
                });
                row.appendChild(wrap);
            });
            if (row.firstChild) row.firstChild.classList.add("selected");
        }

        function renderThreads() {
            const list = document.getElementById("chatList");
            list.innerHTML = "";
            allThreads.sort((a, b) => b.timestamp - a.timestamp);
            allThreads.forEach((t) => {
                list.appendChild(buildThreadElement(t));
            });
        }

        function buildThreadElement(t) {
            const wrap = document.createElement("div");
            wrap.className = "chat-thread";

            const header = document.createElement("div");
            header.className = "thread-header";

            const title = document.createElement("span");
            title.className = "th-title";
            title.textContent = t.title || "";
            header.appendChild(title);

            const author = document.createElement("span");
            author.className = "th-author";
            author.textContent = "글쓴이: " + (t.name || "");
            header.appendChild(author);

            const date = document.createElement("span");
            date.className = "th-date";
            date.textContent = formatDate(t.timestamp);
            header.appendChild(date);

            const num = document.createElement("span");
            num.className = "th-num";
            num.textContent = "№" + t.number;
            header.appendChild(num);

            const replyBtn = document.createElement("button");
            replyBtn.className = "th-reply-btn";
            replyBtn.textContent = "답변";
            replyBtn.addEventListener("click", () => {
                const form = wrap.querySelector(".reply-form-inline");
                if (form) form.classList.toggle("open");
            });
            header.appendChild(replyBtn);

            wrap.appendChild(header);

            const body = document.createElement("div");
            body.className = "thread-body";

            if (t.image) {
                const imgWrap = document.createElement("div");
                imgWrap.className = "th-img";
                const img = document.createElement("img");
                img.src = t.image;
                img.alt = t.image;
                imgWrap.appendChild(img);
                body.appendChild(imgWrap);
            }

            const textWrap = document.createElement("div");
            textWrap.className = "th-text";
            textWrap.style.color = t.color || "#000";

            const commentText = document.createTextNode(t.comment || "");
            textWrap.appendChild(commentText);

            if (t.url && t.url.trim() && t.url.trim() !== "http(s)://") {
                textWrap.appendChild(document.createElement("br"));
                const a = document.createElement("a");
                a.href = t.url.startsWith("http") ? t.url : "http://" + t.url;
                a.target = "_blank";
                a.rel = "noopener";
                a.textContent = t.url;
                textWrap.appendChild(a);
            }

            body.appendChild(textWrap);
            wrap.appendChild(body);

            if (t.replies && t.replies.length > 0) {
                const repliesWrap = document.createElement("div");
                repliesWrap.className = "thread-replies";
                t.replies.forEach((r) => {
                    const rItem = document.createElement("div");
                    rItem.className = "reply-item";

                    const rHead = document.createElement("div");
                    rHead.className = "rp-header";
                    const rAuth = document.createElement("span");
                    rAuth.className = "rp-author";
                    rAuth.textContent = r.name || "익명";
                    rHead.appendChild(rAuth);
                    const rDate = document.createElement("span");
                    rDate.textContent = formatDate(r.timestamp);
                    rHead.appendChild(rDate);
                    rItem.appendChild(rHead);

                    const rText = document.createElement("div");
                    rText.className = "rp-text";
                    rText.textContent = r.comment || "";
                    rItem.appendChild(rText);

                    repliesWrap.appendChild(rItem);
                });
                wrap.appendChild(repliesWrap);
            }

            const replyForm = document.createElement("div");
            replyForm.className = "reply-form-inline";
            replyForm.innerHTML = `
                <div class="rf-row"><label>이름</label><input type="text" class="rf-name" maxlength="30"></div>
                <div class="rf-row"><label>코멘트</label><textarea class="rf-comment"></textarea></div>
                <div class="rf-submit"><button class="rf-submit-btn">답변 등록</button></div>
            `;
            wrap.appendChild(replyForm);

            replyForm.querySelector(".rf-submit-btn").addEventListener("click", () => {
                const rName = replyForm.querySelector(".rf-name").value.trim();
                const rComment = replyForm.querySelector(".rf-comment").value.trim();
                if (!rName || !rComment) {
                    alert("이름과 코멘트를 입력하세요.");
                    return;
                }
                t.replies = t.replies || [];
                t.replies.push({
                    name: rName,
                    comment: rComment,
                    timestamp: Date.now()
                });
                renderThreads();
            });

            return wrap;
        }

        document.getElementById("submitBtn").addEventListener("click", () => {
            const name = document.getElementById("inName").value.trim();
            const email = document.getElementById("inEmail").value.trim();
            const title = document.getElementById("inTitle").value.trim();
            const comment = document.getElementById("inComment").value.trim();
            let url = document.getElementById("inUrl").value.trim();

            if (!name || !title || !comment) {
                alert("이름, 제목, 코멘트를 입력하세요.");
                return;
            }

            if (url === "http(s)://") url = "";

            const thread = {
                number: randomNum(),
                name: name,
                email: email,
                title: title,
                comment: comment,
                url: url,
                image: selectedImage,
                color: selectedColor,
                timestamp: Date.now(),
                replies: []
            };

            allThreads.push(thread);

            document.getElementById("inName").value = "";
            document.getElementById("inEmail").value = "";
            document.getElementById("inTitle").value = "";
            document.getElementById("inComment").value = "";
            document.getElementById("inUrl").value = "http(s)://";
            document.querySelectorAll("#imageSelectRow .img-choice").forEach(el => el.classList.remove("selected"));
            document.querySelectorAll("#colorSelectRow .color-choice").forEach((el, i) => {
                el.classList.toggle("selected", i === 0);
            });
            selectedImage = null;
            selectedColor = "#000000";

            renderThreads();
        });

        buildImageSelectors();
        buildColorSelectors();
        renderThreads();
    </script>
</body>
</html>
