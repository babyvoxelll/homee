<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll</title>
    <style>
        /* Базовый сброс и фон (белый) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, 'Mona12', monospace; /* пиксельный шрифт */
            margin: 0;
            padding: 0;
        }
        /* Главный контейнер — центрирует всё по вертикали и горизонтали */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            margin-top: 30px; /* чуть-чуть опускаем вниз */
        }
        /* Контейнер для плеера — фиксированный размер */
        #player-container {
            width: 800px;
            height: 600px;
            flex-shrink: 0;
            background-color: #ffffff; /* на случай пустоты */
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05); /* лёгкая граница, чтобы видеть область */
        }
        /* Блок с информацией под плеером */
        .info-block {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;        /* маленький текст */
            line-height: 1.6;
            color: #1a3b1a;          /* тёмно-зелёный для всего текста */
            font-family: 'Courier New', Courier, 'Mona12', monospace;
            max-width: 800px;
            padding: 0 10px;
        }
        /* отдельный класс для чёрного текста */
        .text-black {
            color: #000000;
        }
        /* светло-зелёный для отдельных частей */
        .text-light-green {
            color: #5f9f5f;  /* светло-зелёный */
        }
        /* ссылка или email (светло-зелёный) */
        .email-light {
            color: #5f9f5f;
        }
        /* дополнительный отступ между строками, если нужно */
        .info-block p {
            margin: 2px 0;
        }
        /* маленькая адаптивность */
        @media (max-width: 850px) {
            #player-container {
                width: 100%;
                height: auto;
                aspect-ratio: 800 / 600;
            }
            .info-block {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="player-container"></div>

        <!-- Информационный блок (полностью на корейском) -->
        <div class="info-block">
            <p>
                <span class="text-black">babyvoxelll.2bd.net은 베이비복스 팬들을 위한 팬사이트입니다. 이전에는 babyvoxelll.neocities.org라는 주소였으나 현재는 접속이 불가능합니다.</span>
            </p>
            <p>저작권 © 2026 babyvoxelll.2bd.net. 모든 권리 보유.</p>
            <p>
                이 페이지를 보려면 <span class="text-light-green">Macromedia Flash Player</span>가 필요합니다.
            </p>
            <p>
                웹사이트 제작자: Kaze<br>
                이메일: <span class="email-light">kazemorcihelp@gmail.com</span>
            </p>
        </div>
    </div>

    <!-- Подключаем официальный скрипт Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@latest/ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Инициализация Ruffle
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            
            // Очищаем контейнер и добавляем плеер
            container.innerHTML = '';
            container.appendChild(player);
            
            // Загружаем SWF
            player.load({
                url: "babyvoxelllmain.swf"
            });
        });
    </script>
</body>
</html>
