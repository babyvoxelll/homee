<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Flash Player</title>
    <style>
        /* Делаем страницу на весь экран и выравниваем по центру */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #141414; /* Цвет фона страницы */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Контейнер для плеера */
        #player-container {
            width: 800px;  /* Ширина плеера */
            height: 600px; /* Высота плеера */
        }
    </style>
</head>
<body>

    <!-- Контейнер, куда Ruffle внедрит Flash -->
    <div id="player-container"></div>

    <!-- Подключаем Ruffle из официального источника (CDN) -->
    <script src="https://unpkg.com"></script>
    
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player-container");
            
            container.appendChild(player);
            
            // Загружаем ваш .swf файл
            player.load({
                url: "babyvoxelllmainTEST2.swf", // Укажите путь к вашему файлу
                backgroundColor: "#000000",
                autoplay: "on",
                unmuteOverlay: "hidden"
            });
        });
    </script>
</body>
</html>
