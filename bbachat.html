<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>babyvoxelll팬사이트 - BBA Chat</title>
    <link rel="icon" href="babyvoxelll.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background: #990033;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            font-family: "Dotum", "Gulim", "Arial", sans-serif;
        }

        .bbachat-outer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 auto;
            width: 1000px;
            max-width: 1000px;
        }

        .bbacommunity-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 0;
        }
        .bbacommunity-container img {
            display: block;
            width: 180px;
            max-width: 180px;
            height: auto;
        }

        .bbachat-top-imgs {
            position: relative;
            width: 1000px;
            height: 420px;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .bbachat-top-imgs img.panel {
            position: absolute;
            left: 280px;
            bottom: 0;
            width: 720px;
            max-width: 720px;
            height: auto;
            display: block;
            z-index: 2;
        }

        .nav-overlay {
            position: absolute;
            left: 280px;
            bottom: 0;
            width: 720px;
            height: 420px;
            pointer-events: none;
            z-index: 10;
        }
        .nav-overlay a {
            position: absolute;
            display: block;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.001);
            border: none;
            cursor: pointer;
            text-decoration: none;
            height: 22px;
        }
        .nav-overlay a:nth-child(1) { left: 0%;   bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(2) { left: 11%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(3) { left: 23%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(4) { left: 36%;  bottom: 2%; width: 80px; }
        .nav-overlay a:nth-child(5) { left: 52%;  bottom: 2%; width: 55px; }
        .nav-overlay a:nth-child(6) { left: 65%;  bottom: 2%; width: 70px; }
        .nav-overlay a:nth-child(7) { left: 85%;  bottom: 2%; width: 85px; }

        .community-form {
            width: 1000px;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: #000;
        }
        .community-form .form-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .community-form .form-row label {
            width: 140px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            padding-top: 5px;
            flex-shrink: 0;
        }
        .community-form input[type="text"],
        .community-form input[type="email"] {
            flex: 1;
            font-size: 13px;
            padding: 5px;
            border: 1px solid #888;
            background: #fff;
            font-family: inherit;
        }
        .community-form textarea {
            flex: 1;
            font-size: 13px;
            padding: 5px;
            border: 1px solid #888;
            background: #fff;
            min-height: 140px;
            resize: vertical;
            font-family: inherit;
        }
        .community-form .image-select {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 2px;
        }
        .community-form .image-select label {
            width: auto;
            font-size: 0;
            padding: 0;
            cursor: pointer;
            display: block;
            border: 2px solid transparent;
        }
        .community-form .image-select input[type="radio"] {
            display: none;
        }
        .community-form .image-select label img {
            width: 70px;
            height: auto;
            display: block;
        }
        .community-form .image-select input[type="radio"]:checked + img {
            border: 2px solid #00f;
        }
        .community-form .color-select {
            display: flex;
            gap: 10px;
            padding-top: 4px;
        }
        .community-form .color-select label {
            width: auto;
            padding: 0;
            cursor: pointer;
            display: block;
            position: relative;
        }
        .community-form .color-select input[type="radio"] {
            display: none;
        }
        .community-form .color-select .color-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: block;
            border: 2px solid transparent;
            position: relative;
        }
        .community-form .color-select input[type="radio"]:checked + .color-circle {
            border-color: #00f;
        }
        .community-form .color-select .color-circle::after {
            content: "";
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 10px;
            height: 10px;
            background: inherit;
            border: 1px solid #333;
        }
        .color-red { background: #ff0000; }
        .color-blue { background: #0000ff; }
        .color-pink { background: #ff69b4; }
        .color-green { background: #00aa00; }
        .color-purple { background: #800080; }
        .color-brown { background: #8b4513; }
        .color-black { background: #000000; }
        .color-orange { background: #ff8c00; }

        .community-form .submit-row {
            display: flex;
            justify-content: flex-end;
            padding-top: 8px;
        }
        .community-form button#submitBtn {
            padding: 8px 30px;
            font-size: 13px;
            font-weight: bold;
            background: #800020;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
        .community-form button#submitBtn:hover {
            background: #a00028;
        }

        .chat-panel {
            width: 1000px;
            max-width: 1000px;
            background: #fff;
            border: 1px solid #000;
            margin-top: 20px;
            padding: 0;
        }
        .chat-message {
            padding: 14px 18px;
            border-bottom: 1px solid #ddd;
        }
        .chat-message:last-child {
            border-bottom: none;
        }
        .chat-message > .final-divider {
            border-bottom: 2px solid #000;
            margin-top: 12px;
        }
        .chat-message-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .chat-message-header .title {
            color: #006400;
            font-weight: bold;
            font-size: 14px;
        }
        .chat-message-header .meta {
            color: #000;
        }
        .chat-message-header .reply-btn {
            background: none;
            border: 1px solid #888;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            color: #000;
        }
        .chat-message-header .reply-btn:hover {
            background: #eee;
        }
        .chat-message-body {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .chat-message-body .msg-photo {
            width: 80px;
            height: auto;
            flex-shrink: 0;
        }
        .chat-message-body .msg-photo img {
            width: 100%;
            height: auto;
            display: block;
        }
        .chat-message-body .msg-text {
            flex: 1;
            font-size: 13px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .chat-message-body .msg-url {
            font-size: 12px;
            color: #0000ee;
            text-decoration: underline;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            margin-top: 6px;
        }
        .chat-replies {
            margin-left: 40px;
            margin-top: 10px;
            padding-left: 12px;
            border-left: 1px solid #000;
        }
        .chat-reply {
            padding: 8px 0;
            border-bottom: 1px solid #000;
            font-size: 12px;
        }
        .chat-reply:last-child {
            border-bottom: 1px solid #000;
        }
        .chat-reply .reply-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
            color: #000;
        }
        .chat-reply .reply-header .reply-title {
            color: #006400;
            font-weight: bold;
        }
        .chat-reply .reply-body {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .chat-reply .reply-body .reply-photo {
            width: 50px;
            height: auto;
            flex-shrink: 0;
        }
        .chat-reply .reply-body .reply-photo img {
            width: 100%;
            height: auto;
            display: block;
        }
        .chat-reply .reply-body .reply-text {
            flex: 1;
            font-size: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .reply-form {
            margin-left: 40px;
            margin-top: 8px;
            padding: 10px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            display: none;
        }
        .reply-form.open {
            display: block;
        }
        .reply-form .reply-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .reply-form .reply-row label {
            font-size: 12px;
            color: #000;
            width: 80px;
            flex-shrink: 0;
        }
        .reply-form input[type="text"] {
            flex: 1;
            font-size: 12px;
            padding: 3px 6px;
            border: 1px solid #888;
        }
        .reply-form textarea {
            width: 100%;
            font-size: 12px;
            padding: 3px 6px;
            border: 1px solid #888;
            min-height: 50px;
            font-family: inherit;
            resize: vertical;
        }
        .reply-form .reply-submit {
            margin-top: 6px;
            text-align: right;
        }
        .reply-form button {
            padding: 4px 14px;
            font-size: 12px;
            background: #800020;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .reply-form button:hover {
            background: #a00028;
        }

        @media (max-width: 1100px) {
            .bbachat-outer {
                width: 95%;
            }
            .bbachat-top-imgs {
                width: 100%;
            }
            .community-form,
            .chat-panel {
                width: 100%;
            }
        }
        @media (max-width: 900px) {
            .bbachat-top-imgs {
                height: 280px;
            }
            .bbachat-top-imgs img.panel {
                width: 460px;
                max-width: 460px;
                left: 180px;
            }
            .nav-overlay {
                left: 180px;
                width: 460px;
                height: 280px;
            }
            .nav-overlay a {
                width: 40px;
                height: 16px;
            }
        }
        @media (max-width: 500px) {
            .bbachat-outer {
                width: 98%;
            }
            .bbachat-top-imgs {
                height: 200px;
            }
            .bbachat-top-imgs img.panel {
                width: 320px;
                max-width: 320px;
                left: 120px;
            }
            .nav-overlay {
                left: 120px;
                width: 320px;
                height: 200px;
            }
            .nav-overlay a {
                width: 30px;
                height: 12px;
            }
            .community-form .form-row {
                flex-direction: column;
                gap: 4px;
            }
            .community-form .form-row label {
                width: auto;
            }
        }
    </style>
</head>
<body>

    <div class="bbachat-outer">
        <div class="bbacommunity-container">
            <img src="bbacommunity.jpg" alt="bbacommunity">
        </div>

        <div class="bbachat-top-imgs">
            <img src="bbachat.jpg" alt="bbachat" class="panel">
            <div class="nav-overlay">
                <a href="videos.html"></a>
                <a href="index.html"></a>
                <a href="profiles.html"></a>
                <a href="discography.html"></a>
                <a href="history.html"></a>
                <a href="bbachat.html"></a>
                <a href="photogallery.html"></a>
            </div>
        </div>

        <div class="community-form">
            <div class="form-row">
                <label>이름</label>
                <input type="text" id="postName" maxlength="30">
            </div>
            <div class="form-row">
                <label>이메일</label>
                <input type="email" id="postEmail" maxlength="60">
            </div>
            <div class="form-row">
                <label>제목</label>
                <input type="text" id="postTitle" maxlength="80">
            </div>
            <div class="form-row">
                <label>댓글</label>
                <textarea id="postComment" maxlength="5000"></textarea>
            </div>
            <div class="form-row">
                <label>URL</label>
                <input type="text" id="postUrl" placeholder="http(s)://" onfocus="if(this.value=='http(s)://')this.value=''" onblur="if(this.value=='')this.value='http(s)://'">
            </div>
            <div class="form-row">
                <label>이미지</label>
                <div class="image-select">
                    <label><input type="radio" name="postImage" value="kimez.jpg"><img src="kimez.jpg" alt="kimez"></label>
                    <label><input type="radio" name="postImage" value="leeheejin.jpg"><img src="leeheejin.jpg" alt="leeheejin"></label>
                    <label><input type="radio" name="postImage" value="shimeunjin.jpg"><img src="shimeunjin.jpg" alt="shimeunjin"></label>
                    <label><input type="radio" name="postImage" value="kanmiyoun.jpg"><img src="kanmiyoun.jpg" alt="kanmiyoun"></label>
                    <label><input type="radio" name="postImage" value="yooneunhye.jpg"><img src="yooneunhye.jpg" alt="yooneunhye"></label>
                </div>
            </div>
            <div class="form-row">
                <label>텍스트 색상</label>
                <div class="color-select">
                    <label><input type="radio" name="postColor" value="#ff0000"><span class="color-circle color-red"></span></label>
                    <label><input type="radio" name="postColor" value="#0000ff"><span class="color-circle color-blue"></span></label>
                    <label><input type="radio" name="postColor" value="#ff69b4"><span class="color-circle color-pink"></span></label>
                    <label><input type="radio" name="postColor" value="#00aa00"><span class="color-circle color-green"></span></label>
                    <label><input type="radio" name="postColor" value="#800080"><span class="color-circle color-purple"></span></label>
                    <label><input type="radio" name="postColor" value="#8b4513"><span class="color-circle color-brown"></span></label>
                    <label><input type="radio" name="postColor" value="#000000"><span class="color-circle color-black"></span></label>
                    <label><input type="radio" name="postColor" value="#ff8c00"><span class="color-circle color-orange"></span></label>
                </div>
            </div>
            <div class="submit-row">
                <button id="submitBtn">보내기</button>
            </div>
        </div>

        <div class="chat-panel" id="chatPanel"></div>
    </div>

    <script>
        const STORAGE_KEY = "bbachat_messages_v1";

        function loadMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveMessages(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function generateNumber() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function getDayOfWeek(d) {
            const days = ["일", "월", "화", "수", "목", "금", "토"];
            return days[d.getDay()];
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const pad = (n) => n.toString().padStart(2, "0");
            return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${getDayOfWeek(d)}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        let messages = loadMessages();

        function renderChat() {
            const panel = document.getElementById("chatPanel");
            panel.innerHTML = "";

            messages.forEach((msg, msgIndex) => {
                const div = document.createElement("div");
                div.className = "chat-message";

                const header = document.createElement("div");
                header.className = "chat-message-header";

                const title = document.createElement("span");
                title.className = "title";
                title.textContent = msg.title || "(제목 없음)";
                header.appendChild(title);

                const author = document.createElement("span");
                author.className = "meta";
                author.textContent = "작성자: " + (msg.name || "");
                header.appendChild(author);

                const dateEl = document.createElement("span");
                dateEl.className = "meta";
                dateEl.textContent = formatDate(msg.timestamp);
                header.appendChild(dateEl);

                const numEl = document.createElement("span");
                numEl.className = "meta";
                numEl.textContent = "№" + msg.number;
                header.appendChild(numEl);

                const replyBtn = document.createElement("button");
                replyBtn.className = "reply-btn";
                replyBtn.textContent = "답글";
                replyBtn.addEventListener("click", () => {
                    const form = document.getElementById("replyForm-" + msgIndex);
                    if (form) form.classList.toggle("open");
                });
                header.appendChild(replyBtn);

                div.appendChild(header);

                const body = document.createElement("div");
                body.className = "chat-message-body";

                if (msg.image) {
                    const photo = document.createElement("div");
                    photo.className = "msg-photo";
                    const img = document.createElement("img");
                    img.src = msg.image;
                    img.alt = "photo";
                    photo.appendChild(img);
                    body.appendChild(photo);
                }

                const text = document.createElement("div");
                text.className = "msg-text";
                text.style.color = msg.color || "#000";
                text.textContent = msg.comment || "";
                body.appendChild(text);

                div.appendChild(body);

                if (msg.url && msg.url.trim() !== "" && msg.url !== "http(s)://") {
                    const urlEl = document.createElement("a");
                    urlEl.className = "msg-url";
                    urlEl.href = msg.url;
                    urlEl.target = "_blank";
                    urlEl.textContent = msg.url;
                    div.appendChild(urlEl);
                }

                if (msg.replies && msg.replies.length > 0) {
                    const repliesBox = document.createElement("div");
                    repliesBox.className = "chat-replies";
                    msg.replies.forEach((rep) => {
                        const repDiv = document.createElement("div");
                        repDiv.className = "chat-reply";

                        const repHeader = document.createElement("div");
                        repHeader.className = "reply-header";

                        const repTitle = document.createElement("span");
                        repTitle.className = "reply-title";
                        repTitle.textContent = rep.title || "(제목 없음)";
                        repHeader.appendChild(repTitle);

                        const repAuthor = document.createElement("span");
                        repAuthor.textContent = "작성자: " + (rep.name || "");
                        repHeader.appendChild(repAuthor);

                        const repDate = document.createElement("span");
                        repDate.textContent = formatDate(rep.timestamp);
                        repHeader.appendChild(repDate);

                        const repNum = document.createElement("span");
                        repNum.textContent = "№" + rep.number;
                        repHeader.appendChild(repNum);

                        repDiv.appendChild(repHeader);

                        const repBody = document.createElement("div");
                        repBody.className = "reply-body";

                        if (rep.image) {
                            const repPhoto = document.createElement("div");
                            repPhoto.className = "reply-photo";
                            const repImg = document.createElement("img");
                            repImg.src = rep.image;
                            repImg.alt = "photo";
                            repPhoto.appendChild(repImg);
                            repBody.appendChild(repPhoto);
                        }

                        const repText = document.createElement("div");
                        repText.className = "reply-text";
                        repText.style.color = rep.color || "#000";
                        repText.textContent = rep.comment || "";
                        repBody.appendChild(repText);

                        repDiv.appendChild(repBody);

                        if (rep.url && rep.url.trim() !== "" && rep.url !== "http(s)://") {
                            const repUrl = document.createElement("a");
                            repUrl.className = "msg-url";
                            repUrl.href = rep.url;
                            repUrl.target = "_blank";
                            repUrl.textContent = rep.url;
                            repDiv.appendChild(repUrl);
                        }

                        repliesBox.appendChild(repDiv);
                    });
                    div.appendChild(repliesBox);
                }

                const replyForm = document.createElement("div");
                replyForm.className = "reply-form";
                replyForm.id = "replyForm-" + msgIndex;

                replyForm.innerHTML = `
                    <div class="reply-row"><label>이름</label><input type="text" id="repName-${msgIndex}" maxlength="30"></div>
                    <div class="reply-row"><label>제목</label><input type="text" id="repTitle-${msgIndex}" maxlength="80"></div>
                    <div class="reply-row"><label>URL</label><input type="text" id="repUrl-${msgIndex}" value="http(s)://" onfocus="if(this.value=='http(s)://')this.value=''" onblur="if(this.value=='')this.value='http(s)://'"></div>
                    <textarea id="repComment-${msgIndex}" placeholder="댓글"></textarea>
                    <div class="reply-row" style="margin-top:6px;">
                        <label>이미지</label>
                        <div class="image-select" style="padding-top:0;">
                            <label><input type="radio" name="repImage-${msgIndex}" value="kimez.jpg"><img src="kimez.jpg" style="width:40px;"></label>
                            <label><input type="radio" name="repImage-${msgIndex}" value="leeheejin.jpg"><img src="leeheejin.jpg" style="width:40px;"></label>
                            <label><input type="radio" name="repImage-${msgIndex}" value="shimeunjin.jpg"><img src="shimeunjin.jpg" style="width:40px;"></label>
                            <label><input type="radio" name="repImage-${msgIndex}" value="kanmiyoun.jpg"><img src="kanmiyoun.jpg" style="width:40px;"></label>
                            <label><input type="radio" name="repImage-${msgIndex}" value="yooneunhye.jpg"><img src="yooneunhye.jpg" style="width:40px;"></label>
                        </div>
                    </div>
                    <div class="reply-row" style="margin-top:6px;">
                        <label>색상</label>
                        <div class="color-select" style="padding-top:0;">
                            <label><input type="radio" name="repColor-${msgIndex}" value="#ff0000"><span class="color-circle color-red"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#0000ff"><span class="color-circle color-blue"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#ff69b4"><span class="color-circle color-pink"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#00aa00"><span class="color-circle color-green"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#800080"><span class="color-circle color-purple"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#8b4513"><span class="color-circle color-brown"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#000000"><span class="color-circle color-black"></span></label>
                            <label><input type="radio" name="repColor-${msgIndex}" value="#ff8c00"><span class="color-circle color-orange"></span></label>
                        </div>
                    </div>
                    <div class="reply-submit"><button type="button" data-idx="${msgIndex}">답글 등록</button></div>
                `;

                replyForm.querySelector("button[data-idx]").addEventListener("click", (e) => {
                    const idx = parseInt(e.target.getAttribute("data-idx"));
                    const name = document.getElementById("repName-" + idx).value.trim();
                    const title = document.getElementById("repTitle-" + idx).value.trim();
                    const url = document.getElementById("repUrl-" + idx).value.trim();
                    const comment = document.getElementById("repComment-" + idx).value.trim();
                    const imgEl = document.querySelector(`input[name="repImage-${idx}"]:checked`);
                    const colEl = document.querySelector(`input[name="repColor-${idx}"]:checked`);

                    if (!name || !comment) {
                        alert("이름과 댓글을 입력하세요.");
                        return;
                    }

                    messages[idx].replies = messages[idx].replies || [];
                    messages[idx].replies.push({
                        name: name,
                        title: title,
                        url: url,
                        comment: comment,
                        image: imgEl ? imgEl.value : null,
                        color: colEl ? colEl.value : "#000",
                        number: generateNumber(),
                        timestamp: Date.now()
                    });
                    saveMessages(messages);
                    renderChat();
                });

                div.appendChild(replyForm);

                if (msgIndex === messages.length - 1) {
                    const fin = document.createElement("div");
                    fin.className = "final-divider";
                    div.appendChild(fin);
                }

                panel.appendChild(div);
            });
        }

        document.getElementById("submitBtn").addEventListener("click", () => {
            const name = document.getElementById("postName").value.trim();
            const title = document.getElementById("postTitle").value.trim();
            const comment = document.getElementById("postComment").value.trim();
            const url = document.getElementById("postUrl").value.trim();
            const imgEl = document.querySelector('input[name="postImage"]:checked');
            const colEl = document.querySelector('input[name="postColor"]:checked');

            if (!name || !comment) {
                alert("이름과 댓글을 입력하세요.");
                return;
            }

            messages.push({
                name: name,
                email: document.getElementById("postEmail").value.trim(),
                title: title,
                comment: comment,
                url: url,
                image: imgEl ? imgEl.value : null,
                color: colEl ? colEl.value : "#000",
                number: generateNumber(),
                timestamp: Date.now(),
                replies: []
            });
            saveMessages(messages);
            renderChat();

            document.getElementById("postName").value = "";
            document.getElementById("postEmail").value = "";
            document.getElementById("postTitle").value = "";
            document.getElementById("postComment").value = "";
            document.getElementById("postUrl").value = "http(s)://";
            document.querySelectorAll('input[name="postImage"]').forEach((el) => (el.checked = false));
            document.querySelectorAll('input[name="postColor"]').forEach((el) => (el.checked = false));
        });

        document.getElementById("postUrl").value = "http(s)://";
        renderChat();
    </script>
</body>
</html>
